<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão &middot; Corpo e Alma</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Esta página é a última linha: ela aparece quando nem o cache tem o
       endereço pedido. Por isso não depende de nada — nem de fonte da web,
       nem de tema.js, nem do Apps Script. Só do que já está aqui dentro. -->
  <style>
    :root {
      color-scheme: light dark;
      --fundo: #F5F0EB;
      --cartao: #FFFFFF;
      --teal: #3B6E6A;
      --texto: #2D2D2D;
      --suave: #6E655C;
      --linha: #DCD5CB;
      --sage: #C9D3CA;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #141C1B;
        --cartao: #1E2927;
        --teal: #A8D3CE;
        --texto: #E9E3DB;
        --suave: #B4ADA3;
        --linha: #33403E;
        --sage: #3C5A56;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--fundo);
      color: var(--texto);
      font-family: 'Montserrat', Calibri, system-ui, -apple-system, sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    .cartao {
      width: min(420px, 100%);
      padding: 42px 38px 34px;
      border-radius: 16px;
      background: var(--cartao);
      text-align: center;
      box-shadow: 0 1px 2px rgba(20, 40, 38, .10), 0 24px 60px rgba(20, 40, 38, .18);
    }

    img {
      display: block;
      height: 56px;
      width: auto;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-weight: 600;
      font-size: 30px;
      line-height: 1.1;
      color: var(--teal);
    }

    .tag {
      margin-top: 7px;
      font-size: 9.5px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--suave);
    }

    .fio {
      width: 38px;
      height: 1px;
      margin: 22px auto 24px;
      background: var(--sage);
    }

    h2 {
      margin: 0 0 10px;
      font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      font-weight: 600;
      font-size: 22px;
      color: var(--texto);
    }

    p {
      margin: 0;
      font-size: 14px;
      color: var(--suave);
      max-width: 34ch;
      margin-inline: auto;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--teal);
      color: var(--fundo);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: .06em;
      cursor: pointer;
      transition: opacity .18s ease;
    }

    button:hover { opacity: .88; }
    button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

    .voltar {
      display: inline-block;
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--suave);
      text-decoration: none;
    }

    .voltar:hover { color: var(--teal); }

    .estado {
      margin-top: 18px;
      font-size: 11.5px;
      letter-spacing: .06em;
      color: var(--suave);
      min-height: 18px;
    }
  </style>
</head>

<body>
  <main class="cartao">
    <img src="favicon.png" width="128" height="128" alt="" aria-hidden="true">
    <h1>FloreSer</h1>
    <div class="tag">Corpo e Alma</div>
    <div class="fio"></div>

    <h2>Sem conexão</h2>
    <p>Esta tela ainda não está disponível offline. Conecte-se à internet e
      tente novamente.</p>

    <button type="button" id="tentar">Tentar novamente</button>
    <a class="voltar" href="./">&lsaquo; Voltar ao início</a>
    <p class="estado" id="estado" role="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      "use strict";

      var estado = document.getElementById("estado");

      function mostrar() {
        estado.textContent = navigator.onLine
          ? "A conexão parece ter voltado."
          : "Ainda sem conexão.";
      }

      document.getElementById("tentar").addEventListener("click", function () {
        /* recarrega a página que a pessoa realmente queria, não esta */
        location.reload();
      });

      window.addEventListener("online", mostrar);
      window.addEventListener("offline", mostrar);
      mostrar();
    })();
  </script>
</body>

</html>
