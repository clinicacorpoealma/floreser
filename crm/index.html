  <style>

  <script>
    /* Endereco do Apps Script publicado (o mesmo que atende a agenda) */
    var URL_API = "https://script.google.com/macros/s/AKfycbzy9WCfP4l08dn2h2K34uEL6e0mqFBjVMugcHiTc0oUGmpS7gOJjbxs58CB87AoFUw-/exec";

    /* O que fica guardado neste aparelho é um token de sessão, não a senha:
       ele é emitido pelo servidor, vale só para o CRM, expira sozinho por
       inatividade e pode ser cancelado sem afetar nenhum outro aparelho. */
    var CHAVE_TOKEN = "floreser.crm.sessao";
    var SESSAO = { token: "", rev: 0 };

    /* de onde veio a sessão: a senha do módulo ou um usuário individual */
    var ORIGEM_SESSAO = { tipo: "senhaModulo" };

    function guardarToken(x) { try { sessionStorage.setItem(CHAVE_TOKEN, x); } catch (e) { } }
    function tokenGuardado() { try { return sessionStorage.getItem(CHAVE_TOKEN) || ""; } catch (e) { return ""; } }
    function esquecerToken() { try { sessionStorage.removeItem(CHAVE_TOKEN); } catch (e) { } }

    async function sairDoCRM() {
      var token = SESSAO.token;
      esquecerToken();
      SESSAO.token = "";
      try { await chamarAPI({ acao: "sair", token: token }); } catch (e) { /* segue assim mesmo */ }
      location.reload();
    }

    async function chamarAPI(dados) {
      var resposta = await fetch(URL_API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(dados),
        redirect: "follow",
      });
      return await resposta.json();
    }

    /* Adaptador: o app continua usando window.storage,
       mas por baixo tudo vai para a planilha do Google. */
    window.storage = {
      async get(chave) {
        var r = await chamarAPI({ acao: "ler", token: SESSAO.token });
        if (!r.ok) throw new Error(r.erro || "falha ao ler");
        SESSAO.rev = r.rev;
        return { key: chave, value: JSON.stringify(r.dados), shared: false };
      },
      async set(chave, valor) {
        var r = await chamarAPI({
          acao: "salvar",
          token: SESSAO.token,
          rev: SESSAO.rev,
          dados: JSON.parse(valor),
        });
        if (!r.ok) {
          if (r.erro === "conflito") {
            alert(
              "Os dados foram alterados em outro dispositivo enquanto você usava o CRM.\n\n" +
              "A página será recarregada com a versão mais recente. Pode ser necessário refazer a última alteração."
            );
            location.reload();
          }
          if (r.erro === "sessao" || r.erro === "expirada" || r.erro === "inativo") esquecerToken();
          if (r.erro === "sem_acesso") {
            alert("Seu acesso ao CRM foi retirado. A página será recarregada.");
            location.reload();
          }
          throw new Error(r.erro || "falha ao salvar");
        }
        SESSAO.rev = r.rev;
        return { key: chave, value: valor, shared: false };
      },
      async delete(chave) { return { key: chave, deleted: true, shared: false }; },
      async list() { return { keys: [], shared: false }; },
    };
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    /* ===== CRM FloreSer — funil comercial + cadência de follow-up ===== */

    /* Cada cor é uma variável CSS: o estilo inline continua igual, mas o
       valor passa a depender do tema ativo. */
    const CORES = {
      floresta: "var(--crm-floresta)",
      verde: "var(--crm-verde)",
      ouro: "var(--crm-ouro)",
      areia: "var(--crm-areia)",
      branco: "var(--crm-branco)",
      atrasado: "var(--crm-atrasado)",
      borda: "var(--crm-borda)",
      suave: "var(--crm-suave)",
      suaveForte: "var(--crm-suave-forte)",
      /* o texto principal deixa de ser o verde-floresta no escuro */
      texto: "var(--crm-texto)",
      superficie: "var(--crm-superficie)",
      superficie2: "var(--crm-superficie-2)",
      sobreEscuro: "var(--crm-sobre-escuro)",
      verdeFundo: "var(--crm-verde-fundo)",
      sobreVerde: "var(--crm-sobre-verde)",
    };

    const STORAGE_KEY = "crm-floreser-dados";

    /* ---- Cadências: da mais quente para a mais fria ---- */
    const CADENCIAS = [
      { id: "quente", nome: "Quente", padrao: 2 },
      { id: "morno", nome: "Morno", padrao: 5 },
      { id: "frio", nome: "Frio", padrao: 15 },
      { id: "muito_frio", nome: "Muito frio", padrao: 30 },
    ];

    /* ---- Etapas do funil ----
       cadencias: quais cadências a etapa aceita, na ordem de esfriamento
       nivel: até onde o lead chegou no funil. Cada marco é carimbado UMA
              vez, na data em que aconteceu, e nunca é reescrito — por isso
              agendar carimba conversa e agendamento no mesmo dia, e o
              comparecimento semanas depois não duplica o agendamento.
              null quer dizer que a etapa não carimba nada novo: o que já
              foi carimbado continua valendo.
       arquivo: sai do dia a dia, mas continua salvo                      */
    const ETAPAS = [
      { id: "nao_responde", nome: "Não responde", cadencias: ["quente", "morno", "frio", "muito_frio"], nivel: null },
      { id: "conversando", nome: "Conversando", cadencias: ["quente"], nivel: 1 },
      { id: "nurturing", nome: "Nurturing", cadencias: ["frio", "muito_frio"], nivel: null },
      { id: "agendado", nome: "Agendado", cadencias: [], nivel: 2 },
      { id: "falta", nome: "Falta", cadencias: ["quente"], nivel: null },
      { id: "em_aberto", nome: "Em aberto", cadencias: ["quente", "morno", "frio", "muito_frio"], nivel: 3 },
      { id: "venda", nome: "Venda", cadencias: [], nivel: 4, arquivo: true },
      { id: "venda_reprovada", nome: "Venda reprovada", cadencias: [], nivel: 3, arquivo: true, encerra: true },
      { id: "recusado", nome: "Recusado", cadencias: [], nivel: null, arquivo: true, encerra: true },
    ];

    /* ---- De onde a cliente veio ---- */
    const ORIGENS = [
      { id: "instagram", nome: "Instagram" },
      { id: "radio", nome: "Rádio" },
      { id: "vale_presente", nome: "Vale-presente" },
      { id: "indicacao", nome: "Indicação" },
      { id: "google", nome: "Google" },
      { id: "outros", nome: "Outros" },
    ];
    const origemPor = (id) => ORIGENS.find((o) => o.id === id);

    const MARCOS = ["criadoEm", "dtConversa", "dtAgendamento", "dtComparecimento", "dtVenda"];

    const etapaPor = (id) => ETAPAS.find((e) => e.id === id) || ETAPAS[0];
    const cadenciaPor = (id) => CADENCIAS.find((c) => c.id === id);

    /* ---- Datas ---- */
    function hojeISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function paraData(iso) {
      if (!iso) return null;
      const [y, m, d] = String(iso).split("-").map(Number);
      if (!y || !m || !d) return null;
      return new Date(y, m - 1, d);
    }
    function diasDesde(iso) {
      const data = paraData(iso);
      if (!data) return null;
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      return Math.floor((hoje - data) / 86400000);
    }
    function formatarData(iso) {
      if (!iso) return "—";
      const [y, m, d] = String(iso).split("-");
      return d && m ? `${d}/${m}/${y}` : "—";
    }
    function inicioDaSemana() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - d.getDay());
      return d;
    }
    function inicioDoMes() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), 1);
    }
    function novoId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    const NOMES_MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
      "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

    function nomeDoMes(chave) {
      const [ano, mes] = String(chave).split("-").map(Number);
      if (!ano || !mes) return chave;
      const nome = NOMES_MESES[mes - 1];
      return `${nome.charAt(0).toUpperCase()}${nome.slice(1)} de ${ano}`;
    }

    /* ---- Regras de cadência ---- */
    function cadenciaValida(etapaId, cadenciaId) {
      const permitidas = etapaPor(etapaId).cadencias;
      if (!permitidas.length) return "";
      return permitidas.includes(cadenciaId) ? cadenciaId : permitidas[0];
    }
    function proximaCadencia(etapaId, cadenciaId) {
      const permitidas = etapaPor(etapaId).cadencias;
      if (!permitidas.length) return "";
      const i = permitidas.indexOf(cadenciaId);
      if (i === -1) return permitidas[0];
      return permitidas[Math.min(i + 1, permitidas.length - 1)];
    }

    /* ---- Situação do follow-up ---- */
    function situacao(lead, dias) {
      const etapa = etapaPor(lead.etapa);
      if (etapa.arquivo) return { tipo: "arquivado", texto: "Arquivado", atraso: -9999 };
      if (!lead.cadencia) return { tipo: "sem-cadencia", texto: "Sem cadência", atraso: -9999 };
      const intervalo = dias[lead.cadencia] || cadenciaPor(lead.cadencia)?.padrao || 5;
      const passados = diasDesde(lead.ultimoContato);
      if (passados === null) return { tipo: "atrasado", texto: "Nunca contatada", atraso: 999 };
      const restam = intervalo - passados;
      if (restam < 0) return { tipo: "atrasado", texto: `Atrasado ${-restam}d`, atraso: -restam };
      if (restam === 0) return { tipo: "hoje", texto: "Contatar hoje", atraso: 0 };
      return { tipo: "em-dia", texto: `Em ${restam}d`, atraso: -restam };
    }

    /* ---- Marcos do funil: carimba as datas conforme o lead avança ---- */
    function aplicarMarcos(lead, etapaId) {
      const etapa = etapaPor(etapaId);
      const atualizado = { ...lead };
      if (etapa.encerra) atualizado.dtReprovado = atualizado.dtReprovado || hojeISO();
      const nivel = etapa.nivel;
      if (nivel === null || nivel === undefined) return atualizado;
      for (let i = 1; i <= nivel; i++) {
        const campo = MARCOS[i];
        if (!atualizado[campo]) atualizado[campo] = hojeISO();
      }
      return atualizado;
    }

    function CRMFloreSer() {
      const caixaQuem = React.useRef(null);

      const [carregando, setCarregando] = useState(true);
      const [erro, setErro] = useState(null);
      const [leads, setLeads] = useState([]);
      const [dias, setDias] = useState(() => CADENCIAS.reduce((a, c) => ({ ...a, [c.id]: c.padrao }), {}));
      const [aba, setAba] = useState("funil");
      const [periodo, setPeriodo] = useState("semana");
      const [mesRef, setMesRef] = useState(() => hojeISO().slice(0, 7));
      const [filtroEtapa, setFiltroEtapa] = useState("todas");
      const [busca, setBusca] = useState("");
      const [editando, setEditando] = useState(null);
      const [aberto, setAberto] = useState(null);
      const [importando, setImportando] = useState(false);
      const [faixaAberta, setFaixaAberta] = useState(null);
      const [recado, setRecado] = useState("");

      /* a marca "Amanda ▾" é montada fora do React, pelo auth.js, para os três
         módulos usarem exatamente o mesmo componente */
      useEffect(() => {
        if (ORIGEM_SESSAO.tipo !== "usuario" || !caixaQuem.current) return;
        if (caixaQuem.current.childElementCount) return;
        window.FloreSerAuth.montarIdentidade(caixaQuem.current, function () { location.reload(); });
        /* depende de "carregando": o cabeçalho só existe depois da tela de espera */
      }, [carregando]);

      useEffect(() => {
        (async () => {
          try {
            const res = await window.storage.get(STORAGE_KEY);
            if (res && res.value) {
              const d = JSON.parse(res.value);
              if (d.dias) setDias((atual) => ({ ...atual, ...d.dias }));
              if (d.leads) setLeads(d.leads.map(migrar));
            }
          } catch (e) {
            /* primeiro uso */
          } finally {
            setCarregando(false);
          }
        })();
      }, []);

      /* converte cadastros do formato antigo */
      function migrar(l) {
        if (l.etapa === "reprovado") return { ...l, etapa: "recusado" };
        /* Agendando saiu: quem estava lá volta para Conversando */
        if (l.etapa === "agendando") return { ...l, etapa: "conversando", cadencia: "quente" };
        /* Com orçamento e Em aberto viraram a mesma coisa */
        if (l.etapa === "com_orcamento") return { ...l, etapa: "em_aberto" };
        if (l.etapa) return l;
        const antigo = { c1: "quente", c2: "morno", c3: "frio" };
        return {
          ...l,
          etapa: "nao_responde",
          cadencia: antigo[l.categoriaId] || "quente",
          exCliente: false,
          criadoEm: l.criadoEm || hojeISO(),
        };
      }

      async function salvar(novosLeads, novosDias) {
        const lds = novosLeads ?? leads;
        const ds = novosDias ?? dias;
        if (novosLeads) setLeads(novosLeads);
        if (novosDias) setDias(novosDias);
        try {
          await window.storage.set(STORAGE_KEY, JSON.stringify({ leads: lds, dias: ds }));
          setErro(null);
        } catch (e) {
          setErro("Não consegui salvar. Verifique a conexão e tente de novo.");
        }
      }

      function salvarLead(dados) {
        const preparado = aplicarMarcos({ ...dados, cadencia: cadenciaValida(dados.etapa, dados.cadencia) }, dados.etapa);
        if (dados.id) {
          salvar(leads.map((l) => (l.id === dados.id ? { ...l, ...preparado } : l)));
        } else {
          salvar([...leads, { ...preparado, id: novoId(), criadoEm: preparado.criadoEm || hojeISO() }]);
        }
        setEditando(null);
        setAberto(null);
      }

      function mudarEtapa(id, etapaId) {
        salvar(leads.map((l) => {
          if (l.id !== id) return l;
          return aplicarMarcos({ ...l, etapa: etapaId, cadencia: cadenciaValida(etapaId, l.cadencia) }, etapaId);
        }));
      }

      function mudarCadencia(id, cadenciaId) {
        salvar(leads.map((l) => (l.id === id ? { ...l, cadencia: cadenciaId } : l)));
      }

      function alternarExCliente(id) {
        salvar(leads.map((l) => (l.id === id ? { ...l, exCliente: !l.exCliente } : l)));
      }

      /* registra contato e esfria um degrau, dentro do limite da etapa */
      function registrarContato(id) {
        salvar(leads.map((l) =>
          l.id === id ? { ...l, ultimoContato: hojeISO(), cadencia: proximaCadencia(l.etapa, l.cadencia) } : l
        ));
      }

      /* Mover para a lixeira é operação do servidor: ele tira o lead da aba,
         guarda o cadastro inteiro e devolve a revisão nova. Aqui só refletimos
         o que ele já fez — nada é reenviado, para não ressuscitar o registro. */
      async function moverLeadParaLixeira(id, motivo) {
        const lead = leads.find((l) => l.id === id);
        try {
          const r = await chamarAPI({
            acao: "lixeira_mover", token: SESSAO.token, tipo: "crm", id: id, motivo: motivo || "",
          });
          if (!r || !r.ok) {
            setErro(r && r.erro === "sem_acesso"
              ? "Você não possui acesso a este módulo."
              : "Não foi possível concluir a operação. Tente novamente.");
            return;
          }
          if (typeof r.rev === "number") SESSAO.rev = r.rev;
          setLeads(leads.filter((l) => l.id !== id));
          setAberto(null);
          setEditando(null);
          setErro(null);
          /* o nome do lead pode ser de qualquer pessoa: frase sem gênero */
          setRecado((lead ? lead.nome : "O lead") +
            " está na lixeira — dá para restaurar no painel de manutenção por 30 dias.");
        } catch (e) {
          setErro("Não foi possível concluir a operação. Tente novamente.");
        }
      }

      function importarLeads(novos) {
        salvar([...leads, ...novos.map((n) => aplicarMarcos({ ...n, id: novoId() }, n.etapa))]);
        setImportando(false);
        setAba("leads");
      }

      const comSituacao = useMemo(() => leads.map((l) => ({ ...l, sit: situacao(l, dias) })), [leads, dias]);
      const ativos = comSituacao.filter((l) => !etapaPor(l.etapa).arquivo);
      const arquivados = comSituacao.filter((l) => etapaPor(l.etapa).arquivo);

      const pendentes = ativos
        .filter((l) => l.sit.tipo === "atrasado" || l.sit.tipo === "hoje")
        .sort((a, b) => b.sit.atraso - a.sit.atraso);

      const filtrados = ativos
        .filter((l) => filtroEtapa === "todas" || l.etapa === filtroEtapa)
        .filter((l) => l.nome.toLowerCase().includes(busca.toLowerCase()))
        .sort((a, b) => b.sit.atraso - a.sit.atraso);

      const funil = useMemo(() => {
        let de = null;
        let ate = null;
        if (periodo === "semana") {
          de = inicioDaSemana();
        } else if (periodo === "mes") {
          const [ano, mes] = mesRef.split("-").map(Number);
          de = new Date(ano, mes - 1, 1);
          ate = new Date(ano, mes, 1);
        }
        const dentro = (iso) => {
          if (!iso) return false;
          const d = paraData(iso);
          if (!d) return false;
          if (de && d < de) return false;
          if (ate && d >= ate) return false;
          return true;
        };
        /* cada faixa guarda os leads, não só a conta: é o que permite
           abrir a lista de quem está sendo contado ali */
        const faixas = [
          { rotulo: "Leads captados", campo: "criadoEm" },
          { rotulo: "Conversas", campo: "dtConversa" },
          { rotulo: "Agendamentos", campo: "dtAgendamento" },
          { rotulo: "Comparecimentos", campo: "dtComparecimento" },
          { rotulo: "Vendas", campo: "dtVenda" },
        ].map((f) => ({ ...f, leads: leads.filter((l) => dentro(l[f.campo])) }));

        const captados = faixas[0].leads;
        const vendas = faixas[4].leads;

        const origens = ORIGENS
          .map((o) => ({ ...o, qtd: captados.filter((l) => l.origem === o.id).length }))
          .concat([{ id: "", nome: "Não informado", qtd: captados.filter((l) => !l.origem).length }])
          .filter((o) => o.qtd > 0);

        return {
          faixas,
          origens,
          totalCaptados: captados.length,
          porConsulta: vendas.filter((l) => !l.exCliente).length,
          porRecompra: vendas.filter((l) => l.exCliente).length,
        };
      }, [leads, periodo, mesRef]);

      /* meses disponíveis: do primeiro lead captado até o mês atual */
      const mesesDisponiveis = useMemo(() => {
        const atual = hojeISO().slice(0, 7);
        const datas = leads.map((l) => String(l.criadoEm || "").slice(0, 7)).filter((m) => /^\d{4}-\d{2}$/.test(m));
        const inicio = datas.length ? datas.sort()[0] : atual;
        const lista = [];
        let [ano, mes] = inicio.split("-").map(Number);
        const [anoFim, mesFim] = atual.split("-").map(Number);
        let guarda = 0;
        while ((ano < anoFim || (ano === anoFim && mes <= mesFim)) && guarda++ < 120) {
          lista.push(`${ano}-${String(mes).padStart(2, "0")}`);
          mes++;
          if (mes > 12) { mes = 1; ano++; }
        }
        return lista.reverse();
      }, [leads]);

      if (carregando) {
        return (
          <div style={{ minHeight: "100vh", background: CORES.areia, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Montserrat', sans-serif", color: CORES.verde }}>
            Carregando…
          </div>
        );
      }

      const rotuloPeriodo =
        periodo === "semana" ? "nesta semana"

      return (
        <div style={{ minHeight: "100vh", background: CORES.areia, fontFamily: "'Montserrat', -apple-system, sans-serif", color: CORES.texto }}>
          <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        input, select, textarea, button { font-family: 'Montserrat', sans-serif; }
        input:focus, select:focus, textarea:focus { outline: 2px solid ${CORES.verde}; outline-offset: 1px; }
        button { cursor: pointer; }

        /* acabamento no mesmo tom do portal */
        .cartao-lead {
          box-shadow: 0 1px 2px rgba(45,45,45,.04), 0 8px 22px rgba(59,110,106,.07);
          transition: border-color .2s ease, box-shadow .24s ease, transform .24s ease;
        }
        .painel-claro {
          box-shadow: 0 1px 2px rgba(45,45,45,.04), 0 8px 22px rgba(59,110,106,.07);
        }
        .pilula { transition: background .18s ease, color .18s ease; }
        @media (hover: hover) {
          .faixa:not([disabled]):hover { filter: brightness(1.12); }
        }
        .acao { transition: background .18s ease, border-color .18s ease, box-shadow .2s ease; }

        @media (hover: hover) {
          .cartao-lead:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 4px rgba(45,45,45,.05), 0 14px 32px rgba(59,110,106,.13);
          }
          .pilula:hover { background: rgba(245,243,238,0.22); }
          .acao:hover { box-shadow: 0 6px 16px rgba(59,110,106,.18); }
        }

        @keyframes surgir-crm { from { opacity: 0; transform: translateY(8px); } }
        main > section { animation: surgir-crm .42s ease both; }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { animation: none !important; transition: none !important; }
        }
      `}</style>

          <header style={{ background: CORES.floresta, color: CORES.sobreEscuro, padding: "26px 20px 18px" }}>

                      <button key={id} onClick={() => setPeriodo(id)}
                        style={{
                          border: `1.5px solid ${periodo === id ? CORES.verdeFundo : "var(--crm-borda-forte)"}`, background: periodo === id ? CORES.verdeFundo : "none",

                        {txt}

                  </div>
                </div>
                {periodo === "mes" && (
                  <select value={mesRef} onChange={(e) => setMesRef(e.target.value)}

                <p style={{ fontSize: 12.5, color: CORES.suave, margin: "0 0 18px" }}>

                </p>

                <GraficoFunil faixas={funil.faixas} mostrarPercentual={periodo === "tudo"} aoAbrirFaixa={setFaixaAberta} />

                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14 }}>
                  <Indicador rotulo="Vendas por consulta" valor={funil.porConsulta} nota="Cliente nova" />
                  <Indicador rotulo="Vendas por recompra" valor={funil.porRecompra} nota="Ex-cliente" />
                </div>

                <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 21, fontWeight: 600, margin: "26px 0 4px" }}>
                  Origem dos leads
                </h3>
                <p style={{ fontSize: 12.5, color: CORES.suave, margin: "0 0 12px" }}>
                  De onde vieram os {funil.totalCaptados} lead{funil.totalCaptados !== 1 ? "s" : ""} captado{funil.totalCaptados !== 1 ? "s" : ""} {rotuloPeriodo}.
                </p>
                <GraficoOrigem origens={funil.origens} total={funil.totalCaptados} />

                <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 21, fontWeight: 600, margin: "26px 0 10px" }}>
                  Onde estão os leads agora
                </h3>
                <div className="painel-claro" style={{ background: CORES.branco, borderRadius: 12, border: `1px solid ${CORES.borda}`, padding: "6px 16px" }}>
                  {ETAPAS.filter((e) => !e.arquivo).map((e) => {
                    const qtd = ativos.filter((l) => l.etapa === e.id).length;
                    return (
                      <button key={e.id} onClick={() => { setFiltroEtapa(e.id); setAba("leads"); }}
                        style={{
                          display: "flex", justifyContent: "space-between", width: "100%", border: "none", background: "none",
                          padding: "10px 0", borderBottom: `1px solid ${CORES.borda}`, fontSize: 14, color: CORES.texto, textAlign: "left"
                        }}>
                        <span>{e.nome}</span>
                        <strong style={{ color: qtd ? CORES.verde : CORES.suave }}>{qtd}</strong>
                      </button>
                    );
                  })}
                  <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", fontSize: 14, color: CORES.suave }}>
                    <span>Ex-clientes na base</span>
                    <strong>{leads.filter((l) => l.exCliente).length}</strong>
                  </div>
                </div>
              </section>
            )}

            {/* ===== FOLLOW-UPS ===== */}
            {aba === "hoje" && (
              <section>
                <h2 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 25, fontWeight: 600, margin: "6px 0 4px" }}>
                  Quem precisa de você hoje
                </h2>
                <p style={{ fontSize: 13, color: CORES.suave, margin: "0 0 18px" }}>
                  Ao registrar o contato, o lead esfria um degrau — dentro do limite que a etapa permite.
                </p>
                {pendentes.length === 0 ? (
                  <Vazio titulo="Tudo em dia" texto="Nenhum lead aguardando contato agora." />
                ) : (
                  pendentes.map((l) => (
                    <CartaoLead key={l.id} lead={l} aoAbrir={() => setAberto(l)} aoContatar={() => registrarContato(l.id)} />
                  ))
                )}
              </section>
            )}

            {/* ===== LEADS ===== */}
            {aba === "leads" && (
              <section>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "6px 0 16px" }}>
                  <input placeholder="Buscar por nome…" value={busca} onChange={(e) => setBusca(e.target.value)}
                    style={{ flex: "1 1 150px", padding: "10px 12px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 14, background: CORES.branco }} />
                  <select value={filtroEtapa} onChange={(e) => setFiltroEtapa(e.target.value)}
                    style={{ padding: "10px 12px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 14, background: CORES.branco }}>
                    <option value="todas">Todas as etapas</option>
                    {ETAPAS.filter((e) => !e.arquivo).map((e) => <option key={e.id} value={e.id}>{e.nome}</option>)}
                  </select>
                  <button className="acao" onClick={() => setEditando("novo")}
                    style={{ padding: "10px 18px", borderRadius: 8, border: "none", background: CORES.verdeFundo, color: CORES.sobreVerde, fontWeight: 600, fontSize: 14 }}>
                    + Novo lead
                  </button>
                  <button onClick={() => setImportando(true)}
                    style={{ padding: "10px 18px", borderRadius: 8, border: `1.5px solid ${CORES.ouro}`, background: "none", color: CORES.ouro, fontWeight: 600, fontSize: 14 }}>
                    Importar planilha
                  </button>
                </div>
                {filtrados.length === 0 ? (
                  <Vazio titulo="Nenhum lead aqui" texto="Cadastre um novo lead ou importe sua planilha." />
                ) : (
                  filtrados.map((l) => (
                    <CartaoLead key={l.id} lead={l} aoAbrir={() => setAberto(l)} aoContatar={() => registrarContato(l.id)} />
                  ))
                )}
              </section>
            )}

            {/* ===== ARQUIVO ===== */}
            {aba === "arquivo" && (
              <section>
                <button onClick={() => setAba("funil")}
                  style={{ border: "none", background: "none", color: CORES.verde, fontSize: 13, fontWeight: 600, padding: 0, marginBottom: 10 }}>
                  ← Voltar
                </button>
                <h2 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 25, fontWeight: 600, margin: "6px 0 4px" }}>Arquivo</h2>
                <p style={{ fontSize: 13, color: CORES.suave, margin: "0 0 18px" }}>
                  Vendas e reprovados saem do dia a dia, mas continuam salvos e contando nos indicadores.
                </p>
                {arquivados.length === 0 ? (
                  <Vazio titulo="Arquivo vazio" texto="Nada marcado como venda ou reprovado ainda." />
                ) : (
                  arquivados
                    .slice()
                    .sort((a, b) => String(b.dtVenda || b.dtReprovado || "").localeCompare(String(a.dtVenda || a.dtReprovado || "")))
                    .map((l) => <CartaoLead key={l.id} lead={l} aoAbrir={() => setAberto(l)} semContato />)
                )}
              </section>
            )}

            {/* ===== CADÊNCIAS ===== */}
            {aba === "config" && (
              <section>
                <h2 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 25, fontWeight: 600, margin: "6px 0 4px" }}>Cadências</h2>
                <p style={{ fontSize: 13, color: CORES.suave, margin: "0 0 18px" }}>
                  De quantos em quantos dias você entra em contato em cada temperatura.
                </p>
                {CADENCIAS.map((c) => (
                  <div key={c.id} style={{ background: CORES.branco, borderRadius: 12, border: `1px solid ${CORES.borda}`, padding: "12px 16px", marginBottom: 10, display: "flex", alignItems: "center", gap: 12 }}>
                    <span style={{ flex: 1, fontWeight: 600, fontSize: 15 }}>{c.nome}</span>
                    <span style={{ fontSize: 13, color: CORES.suave }}>a cada</span>
                    <input type="number" min="1" value={dias[c.id]}
                      onChange={(e) => salvar(null, { ...dias, [c.id]: Math.max(1, Number(e.target.value) || 1) })}
                      style={{ width: 70, padding: "8px 10px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 14, textAlign: "center" }} />
                    <span style={{ fontSize: 13, color: CORES.suave }}>dias</span>
                  </div>
                ))}

                <div style={{ background: "var(--crm-superficie-2)", borderRadius: 12, padding: "14px 16px", marginTop: 18 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.ouro, marginBottom: 10 }}>
                    Até onde cada etapa pode esfriar
                  </div>
                  {ETAPAS.map((e) => (
                    <div key={e.id} style={{ fontSize: 13, padding: "5px 0", display: "flex", justifyContent: "space-between", gap: 12 }}>
                      <span style={{ fontWeight: 600 }}>{e.nome}</span>
                      <span style={{ color: CORES.verde, textAlign: "right" }}>
                        {e.encerra ? "Arquiva sem venda" : e.arquivo ? "Arquiva como venda" : e.cadencias.length === 0 ? "Sem cadência" : e.cadencias.map((c) => cadenciaPor(c).nome).join(" → ")}

    /* ==== Gráfico de funil — cada faixa abre a lista de quem está nela ==== */
    function GraficoFunil({ faixas, mostrarPercentual, aoAbrirFaixa }) {
      const maximo = Math.max(...faixas.map((f) => f.leads.length), 1);
      const tons = ["var(--crm-faixa-1)", "var(--crm-faixa-2)", "var(--crm-faixa-3)",
        "var(--crm-faixa-4)", "var(--crm-faixa-5)"];

      return (
        <div className="painel-claro" style={{ background: CORES.branco, borderRadius: 12, border: `1px solid ${CORES.borda}`, padding: "18px 16px" }}>
          {faixas.map((f, i) => {
            const valor = f.leads.length;
            const largura = Math.max((valor / maximo) * 100, valor > 0 ? 16 : 8);
            const anterior = i > 0 ? faixas[i - 1].leads.length : null;
            const conv = anterior ? Math.round((valor / anterior) * 100) : null;
            return (
              <div key={f.rotulo} style={{ marginBottom: i === faixas.length - 1 ? 0 : 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}>
                  <span style={{ fontWeight: 600 }}>{f.rotulo}</span>
                  {mostrarPercentual && conv !== null && anterior > 0 && (
                    <span style={{ color: CORES.suave }}>{conv}% da etapa anterior</span>
                  )}
                </div>
                <div style={{ display: "flex", justifyContent: "center" }}>
                  <button className="faixa" onClick={() => valor > 0 && aoAbrirFaixa(f)}
                    disabled={valor === 0}
                    title={valor > 0 ? "Ver quem está nesta faixa" : ""}
                    style={{
                      width: `${largura}%`, background: tons[i], color: CORES.sobreVerde, borderRadius: 6, border: "none",
                      padding: "9px 12px", textAlign: "center", fontWeight: 700, fontSize: 16, minWidth: 54,

    /* ==== Importação ==== */
    function normalizarData(valor) {
      if (!valor && valor !== 0) return "";
      if (valor instanceof Date && !isNaN(valor)) {
        return `${valor.getFullYear()}-${String(valor.getMonth() + 1).padStart(2, "0")}-${String(valor.getDate()).padStart(2, "0")}`;
      }
      const s = String(valor).trim();
      let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (m) {
        const ano = m[3].length === 2 ? `20${m[3]}` : m[3];
        return `${ano}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
      }
      return "";
    }

    function acharEtapa(texto) {
      const t = String(texto || "").trim().toLowerCase();
      if (!t) return null;
      const achada = ETAPAS.find((e) => e.nome.toLowerCase() === t || e.id === t);
      if (achada) return achada.id;
      if (t.includes("não resp") || t.includes("nao resp")) return "nao_responde";
      if (t.includes("nurtur") || t.includes("nutri")) return "nurturing";
      if (t.includes("convers")) return "conversando";
      /* "Agendando" era uma etapa que saiu: quem vier assim da planilha entra
         como Conversando, igual ao que acontece com os cadastros antigos */
      if (t.includes("agendand")) return "conversando";
      if (t.includes("agendad")) return "agendado";
      if (t.includes("aberto") || t.includes("orçam") || t.includes("orcam")) return "em_aberto";
      if (t.includes("falt")) return "falta";
      if (t.includes("reprov")) return "venda_reprovada";
      if (t.includes("recus") || t.includes("perdid") || t.includes("descart")) return "recusado";
      if (t.includes("vend")) return "venda";
      return null;
    }

    function acharOrigem(texto) {
      const t = String(texto || "").trim().toLowerCase();
      if (!t) return "";
      const achada = ORIGENS.find((o) => o.nome.toLowerCase() === t || o.id === t);
      if (achada) return achada.id;
      if (t.includes("insta")) return "instagram";
      if (t.includes("rádio") || t.includes("radio")) return "radio";
      if (t.includes("vale") || t.includes("presente")) return "vale_presente";
      if (t.includes("indica")) return "indicacao";
      if (t.includes("google") || t.includes("busca")) return "google";
      return "outros";
    }

    function ImportarPlanilha({ aoImportar, aoCancelar }) {
      const [linhas, setLinhas] = useState(null);
      const [colunas, setColunas] = useState([]);
      const [mapa, setMapa] = useState({ nome: "", whatsapp: "", interesse: "", origem: "", observacoes: "", etapa: "", exCliente: "", ultimoContato: "" });
      const [etapaPadrao, setEtapaPadrao] = useState("nao_responde");
      const [erroArq, setErroArq] = useState(null);

      async function lerArquivo(e) {
        const arquivo = e.target.files?.[0];
        if (!arquivo) return;
        setErroArq(null);
        try {
          const buf = await arquivo.arrayBuffer();
          const wb = XLSX.read(buf, { cellDates: true });
          const dados = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          if (!dados.length) { setErroArq("A planilha está vazia ou sem cabeçalhos na primeira linha."); return; }
          const cab = Object.keys(dados[0]);
          const achar = (...t) => cab.find((h) => t.some((x) => h.toLowerCase().includes(x))) || "";
          setColunas(cab);
          setLinhas(dados);
          setMapa({
            nome: achar("nome", "cliente", "lead"),
            whatsapp: achar("whats", "telefone", "celular", "fone"),
            interesse: achar("interesse", "tratamento", "procedimento"),
            origem: achar("origem", "fonte", "veio"),
            observacoes: achar("obs", "nota", "coment"),
            etapa: achar("etapa", "situa", "status", "categoria"),
            exCliente: achar("ex-cliente", "ex cliente", "recompra"),
            ultimoContato: achar("contato", "data"),
          });
        } catch {
          setErroArq("Não consegui ler este arquivo. Use .xlsx, .xls ou .csv.");
        }
      }

      const validos = useMemo(() => {
        if (!linhas || !mapa.nome) return [];
        return linhas.map((r) => {
          const nome = String(r[mapa.nome] ?? "").trim();
          if (!nome) return null;
          const etapaId = (mapa.etapa && acharEtapa(r[mapa.etapa])) || etapaPadrao;
          const ex = mapa.exCliente
            ? ["sim", "s", "x", "true", "1", "ex-cliente", "ex cliente"].includes(String(r[mapa.exCliente] ?? "").trim().toLowerCase())
            : false;
          const contato = (mapa.ultimoContato && normalizarData(r[mapa.ultimoContato])) || hojeISO();
          /* se o contato da planilha é mais antigo que hoje, ele também marca a captação */
          const captacao = contato < hojeISO() ? contato : hojeISO();
          return {
            nome,
            whatsapp: mapa.whatsapp ? String(r[mapa.whatsapp] ?? "").trim() : "",
            interesse: mapa.interesse ? String(r[mapa.interesse] ?? "").trim() : "",
            origem: mapa.origem ? acharOrigem(r[mapa.origem]) : "",
            observacoes: mapa.observacoes ? String(r[mapa.observacoes] ?? "").trim() : "",
            etapa: etapaId,
            cadencia: cadenciaValida(etapaId, "quente"),
            exCliente: ex,
            ultimoContato: contato,
            criadoEm: captacao,
          };
        }).filter(Boolean);
      }, [linhas, mapa, etapaPadrao]);

      const campo = { display: "block", width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 13, background: CORES.branco, marginTop: 4 };
      const rot = { fontSize: 12, fontWeight: 600, color: CORES.texto, display: "block", marginTop: 12 };

      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: 0 }}>Importar planilha</h3>
          <p style={{ fontSize: 13, color: CORES.verde, margin: "6px 0 14px" }}>
            A primeira linha deve ter os títulos das colunas (Nome, WhatsApp, Etapa…).
          </p>
          <input type="file" accept=".xlsx,.xls,.csv" onChange={lerArquivo} style={{ fontSize: 13 }} />
          {erroArq && <div style={{ color: CORES.atrasado, fontSize: 13, marginTop: 8 }}>{erroArq}</div>}

          {linhas && (
            <>
              <div style={{ background: "var(--crm-superficie-2)", borderRadius: 10, padding: "12px 14px", marginTop: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.ouro }}>
                  Combine as colunas da sua planilha
                </div>
                {[["nome", "Nome *"], ["whatsapp", "WhatsApp"], ["interesse", "Interesse"], ["observacoes", "Observações"], ["etapa", "Etapa"], ["exCliente", "Ex-cliente"], ["ultimoContato", "Último contato"]].map(([k, txt]) => (
                  <label key={k} style={rot}>{txt}
                    <select style={campo} value={mapa[k]} onChange={(e) => setMapa({ ...mapa, [k]: e.target.value })}>
                      <option value="">— não importar —</option>
                      {colunas.map((c) => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </label>
                ))}
                <label style={rot}>Etapa padrão (quando a linha não tiver etapa reconhecida)
                  <select style={campo} value={etapaPadrao} onChange={(e) => setEtapaPadrao(e.target.value)}>
                    {ETAPAS.map((e) => <option key={e.id} value={e.id}>{e.nome}</option>)}
                  </select>
                </label>
              </div>

              <div style={{ fontSize: 13, marginTop: 14 }}>
                {mapa.nome
                  ? <>Prontos para importar: <strong>{validos.length}</strong> lead{validos.length !== 1 ? "s" : ""}. Linhas sem nome são ignoradas.</>
                  : "Escolha qual coluna contém o nome do lead."}
              </div>

              <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                <button disabled={!validos.length} onClick={() => aoImportar(validos)}
                  style={{ background: validos.length ? CORES.verdeFundo : "var(--crm-desativado)", color: CORES.sobreVerde, border: "none", borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600, cursor: validos.length ? "pointer" : "not-allowed" }}>
                  Importar {validos.length || ""} lead{validos.length !== 1 ? "s" : ""}
                </button>
                <button onClick={aoCancelar} style={{ background: "none", border: "1.5px solid var(--crm-borda-media)", color: CORES.texto, borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600 }}>
                  Cancelar
                </button>
              </div>
            </>
          )}
        </div>
      );
    }

    /* ==== Modal ==== */
    function Modal({ children, aoFechar }) {
      return (
        <div onClick={aoFechar}
          style={{ position: "fixed", inset: 0, background: "rgba(30,58,58,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50, padding: 12 }}>
          <div onClick={(e) => e.stopPropagation()}
            style={{ background: CORES.areia, borderRadius: 16, padding: "22px 20px 26px", width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto", boxShadow: "0 12px 40px rgba(30,58,58,0.3)" }}>
            <button onClick={aoFechar} aria-label="Fechar" style={{ float: "right", border: "none", background: "none", fontSize: 18, color: CORES.verde, marginTop: -6 }}>✕</button>
            {children}
          </div>
        </div>
      );
    }

    /* ==== Tela de entrada com senha ==== */
    function Portao() {
      const [senha, setSenha] = useState("");
      const [estado, setEstado] = useState("form"); // form | verificando | ok
      const [erro, setErro] = useState("");
      const [mostrar, setMostrar] = useState(false);

      /* Entrada por usuário individual: a tela é a mesma do portal, servida
         pelo auth.js. Aqui só dizemos qual módulo estamos pedindo e o que
         fazer quando a pessoa entrar — nada de segunda tela nem de segunda
         sessão. A permissão de verdade é conferida pelo Apps Script em toda
         chamada. */
      function abrirLoginDeUsuario() {
        setErro("");
        window.FloreSerAuth.abrirLogin({
          modulo: "crm",
          aoEntrar: function (r) {
            SESSAO.token = r.token;
            ORIGEM_SESSAO = { tipo: "usuario" };
            setEstado("ok");
          },
        });
      }

      /* Troca a senha por um token de sessão. A senha não fica guardada aqui
         nem é reenviada depois: daqui para a frente só o token viaja. */
      async function entrar() {
        if (!senha.trim()) return;
        setEstado("verificando");
        setErro("");
        try {
          const r = await chamarAPI({ acao: "entrar", modulo: "crm", senha: senha });
          if (!r.ok) {
            if (r.erro === "bloqueado") {
              setErro("Muitas tentativas erradas. Tente de novo em " + (r.minutos || 15) + " minutos.");
            } else if (r.erro === "senha") {
              setErro("Senha incorreta. Confira e tente de novo." +
                (r.restam ? " Restam " + r.restam + " tentativas." : ""));
            } else {
              setErro("Não foi possível conectar à planilha. Verifique a publicação do Apps Script.");
            }
            setEstado("form");
            return;
          }
          SESSAO.token = r.token;
          guardarToken(r.token);
          setEstado("ok");
        } catch (e) {
          setErro("Sem conexão com a planilha. Confira a URL do Apps Script e sua internet.");
          setEstado("form");
        }
      }

      /* Ao abrir: primeiro a sessão de usuário guardada neste navegador, que
         vale para os três módulos; depois a sessão da senha desta aba. */
      useEffect(() => {
        let vivo = true;
        (async () => {
          if (window.FloreSerAuth && window.FloreSerAuth.token()) {
            try {
              const r = await window.FloreSerAuth.retomar("crm");
              if (!vivo) return;
              if (r && r.ok) {
                SESSAO.token = window.FloreSerAuth.token();
                ORIGEM_SESSAO = { tipo: "usuario" };
                setEstado("ok");
                return;
              }
              if (r && r.erro === "sem_acesso") {
                setErro("Você não possui acesso a este módulo. Entre com a senha ou com outro usuário.");
              } else if (r && r.erro === "expirada") {
                setErro("Sua sessão expirou por inatividade. Entre novamente para continuar.");
              }
            } catch (e) { /* segue para a senha do módulo */ }
          }

          const guardado = tokenGuardado();
          if (!guardado) return;
          SESSAO.token = guardado;
          try {
            const r = await chamarAPI({ acao: "ler", token: guardado });
            if (!vivo) return;
            if (r.ok) { setEstado("ok"); return; }
            esquecerToken();
            SESSAO.token = "";
            if (r.erro === "sessao") setErro("Sua sessão expirou. Informe a senha de novo.");
          } catch (e) {
            esquecerToken();
            SESSAO.token = "";
          }
        })();
        return () => { vivo = false; };
      }, []);

      if (estado === "ok") return <CRMFloreSer />;

      const carregando = estado === "verificando";

      return (
        <div className="pt-fundo">
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@300;400;500;600&display=swap');

            .pt-fundo, .pt-fundo * { box-sizing: border-box; }

            .pt-fundo {
              position: relative; min-height: 100vh; overflow: hidden;
              display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 18px; padding: 28px 20px; background: var(--teal-escuro-fundo);
              font-family: 'Montserrat', Calibri, system-ui, sans-serif;
            }
            .pt-fundo::before {
              content: ""; position: absolute; right: -140px; bottom: -170px;
              width: 520px; height: 520px; background: url("../logo.png") no-repeat center/contain;
              opacity: .055; filter: brightness(0) invert(1); pointer-events: none;
            }

            .pt-cartao {
              position: relative; width: 100%; max-width: 400px; padding: 42px 38px 32px;
              background: var(--crm-portao-cartao); border-radius: 16px; text-align: center;
              box-shadow: 0 1px 2px rgba(20,40,38,.10), 0 24px 60px rgba(20,40,38,.30);
              animation: pt-surge .5s cubic-bezier(.2,.8,.2,1) both;
            }
            @keyframes pt-surge { from { opacity: 0; transform: translateY(12px); } }

            .pt-marca { display: block; height: 56px; width: auto; margin: 0 auto 20px; }
            .pt-nome {
              font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 600;
              color: var(--crm-verde); line-height: 1.1; margin: 0;
            }
            .pt-nome span { font-style: italic; color: var(--crm-ouro); }
            .pt-tag {
              margin: 7px 0 0; font-size: 9.5px; font-weight: 300; letter-spacing: .26em;
              text-transform: uppercase; color: var(--crm-taupe);
            }
            .pt-risco { width: 38px; height: 1px; background: var(--crm-sage); margin: 22px auto 24px; }

            .pt-campo { position: relative; display: flex; align-items: center; }
            .pt-so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden;
              clip: rect(0 0 0 0); white-space: nowrap; }
            .pt-cadeado { position: absolute; left: 14px; color: var(--crm-taupe); pointer-events: none; }
            .pt-campo input {
              width: 100%; padding: 14px 46px 14px 40px; background: var(--crm-campo);
              border: 1px solid var(--crm-linha); border-radius: 10px; font-size: 15px; color: var(--crm-campo-texto);
              letter-spacing: .02em; text-align: left;
              transition: border-color .18s ease, box-shadow .18s ease;
            }
            .pt-campo input::placeholder { color: var(--crm-placeholder); letter-spacing: .01em; }
            .pt-campo input:focus {
              outline: none; border-color: var(--crm-foco); box-shadow: 0 0 0 3px rgba(90,148,144,.16);
            }

            .pt-olho {
              position: absolute; right: 6px; width: 34px; height: 34px; display: flex;
              align-items: center; justify-content: center; border: none; border-radius: 8px;
              background: none; color: var(--crm-taupe); cursor: pointer;
              transition: color .18s ease, background .18s ease;
            }
            .pt-olho:hover { color: var(--crm-verde); background: rgba(201,211,202,.45); }
            .pt-olho:focus-visible { outline: 2px solid var(--crm-foco); outline-offset: 1px; }

            .pt-erro {
              display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; padding: 10px 12px;
              border-radius: 8px; background: var(--crm-erro-bg); color: var(--crm-erro); font-size: 12.5px;
              line-height: 1.45; text-align: left; animation: pt-surge .26s ease both;
            }
            .pt-erro svg { flex: 0 0 auto; margin-top: 1px; }

            .pt-entrar {
              width: 100%; margin-top: 16px; padding: 13px; border: none; border-radius: 10px;
              background: var(--crm-verde-fundo); color: var(--crm-sobre-verde); font-family: inherit; font-size: 13.5px;
              font-weight: 600; letter-spacing: .06em; display: flex; align-items: center;
              justify-content: center; gap: 10px;
              transition: background .18s ease, box-shadow .2s ease, transform .15s ease;
            }
            .pt-entrar:hover:not([disabled]) {
              background: var(--crm-verde-hover); box-shadow: 0 8px 20px rgba(59,110,106,.28);
            }
            .pt-entrar:active:not([disabled]) { transform: translateY(1px); }
            .pt-entrar:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
            .pt-entrar[disabled] { opacity: .72; cursor: default; box-shadow: none; }
            .pt-entrar.carregando::after {
              content: ""; width: 14px; height: 14px; border-radius: 50%;
              border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
              animation: pt-gira .7s linear infinite;
            }
            @keyframes pt-gira { to { transform: rotate(360deg); } }

            .pt-alternar {
              width: 100%; margin-top: 12px; padding: 9px; border: none; background: none;
              font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: .14em;
              text-transform: uppercase; color: var(--crm-taupe); cursor: pointer;
              border-radius: 8px; transition: color .18s ease, background .18s ease;
            }
            .pt-alternar:hover { color: var(--crm-verde); background: var(--crm-etiqueta-cad-bg); }
            .pt-alternar:focus-visible { outline: 2px solid var(--crm-foco); outline-offset: 1px; }
            .pt-campo + .pt-campo { margin-top: 10px; }
            .pt-campo.simples input { padding-left: 14px; }

            .pt-volta {
              font-size: 9.5px; font-weight: 300; letter-spacing: .22em; text-transform: uppercase;
              color: rgba(255,255,255,.72); text-decoration: none; padding: 8px 12px;
              border-radius: 8px; transition: color .18s ease, background .18s ease;
            }
            .pt-volta:hover { color: #fff; background: rgba(255,255,255,.08); }
            .pt-volta:focus-visible { outline: 2px solid rgba(255,255,255,.55); outline-offset: 2px; }

            @media (max-width: 480px) {
              .pt-cartao { padding: 34px 24px 28px; border-radius: 14px; }
              .pt-marca { height: 48px; margin-bottom: 16px; }
              .pt-nome { font-size: 26px; }
              .pt-risco { margin: 18px auto 20px; }
            }
            @media (prefers-reduced-motion: reduce) {
              .pt-cartao, .pt-erro { animation: none; }
              .pt-entrar.carregando::after { animation: none; }
            }
          `}</style>

          <div className="pt-cartao">
            <img className="pt-marca" src="../logo.png" width="366" height="380" alt="Símbolo FloreSer" />
            <h1 className="pt-nome">CRM Flore<span>Ser</span></h1>
            <p className="pt-tag">Clínica Corpo e Alma</p>
            <div className="pt-risco"></div>

            <div className="pt-campo">
              <label className="pt-so-leitor" htmlFor="pt-senha">Senha de acesso</label>
              <svg className="pt-cadeado" width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" aria-hidden="true">
                <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" />
                <path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7" />
              </svg>

              <input
                id="pt-senha"
                type={mostrar ? "text" : "password"}
                value={senha}
                onChange={(e) => setSenha(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") entrar(); }}
                placeholder="Senha de acesso"
                autoComplete="current-password"
                disabled={carregando}
                autoFocus
              />

              <button type="button" className="pt-olho"
                onClick={() => setMostrar(!mostrar)}
                aria-pressed={mostrar}
                aria-label={mostrar ? "Ocultar senha" : "Mostrar senha"}>
                {mostrar ? (
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d="M2.5 12S6.1 5.5 12 5.5c1.6 0 3 .3 4.3.9M21.5 12s-3.6 6.5-9.5 6.5c-1.7 0-3.1-.3-4.4-.9" />
                    <path d="M9.7 9.8a3 3 0 0 0 4.2 4.2" />
                    <path d="M4.2 19.8 19.8 4.2" />
                  </svg>
                ) : (
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d="M2.5 12S6.1 5.5 12 5.5 21.5 12 21.5 12 17.9 18.5 12 18.5 2.5 12 2.5 12Z" />
                    <circle cx="12" cy="12" r="2.8" />
                  </svg>
                )}
              </button>
            </div>

            {erro && (
              <div className="pt-erro" role="alert">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  strokeWidth="1.5" strokeLinecap="round" aria-hidden="true">
                  <path d="M12 3.8 21 19.5H3L12 3.8Z" />
                  <path d="M12 10v4M12 16.6v.4" />
                </svg>
                <span>{erro}</span>
              </div>
            )}

            <button
              className={carregando ? "pt-entrar carregando" : "pt-entrar"}
              onClick={entrar}
              disabled={carregando || !senha.trim()}
            >
              {carregando ? "Conectando…" : "Entrar"}
            </button>
            <button type="button" className="pt-alternar" onClick={abrirLoginDeUsuario}>
              Entrar com usuário
            </button>
          </div>

          <a className="pt-volta" href="../">‹ Início</a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Portao />);
  </script>
</body>

</html>
