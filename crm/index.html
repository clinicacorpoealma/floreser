<body>
  <div id="root"></div>

  <script src="crm-core.js"></script>

  <!-- O JSX fica aqui dentro de proposito. Com src="", o Babel busca o
       arquivo por XMLHttpRequest, e o Chrome bloqueia isso entre arquivos
       locais: abrir o CRM por file:// dava tela em branco. Inline nao ha
       busca nenhuma. A apresentacao esta no crm.css e a infraestrutura no
       crm-core.js, que entram por tag comum e funcionam dos dois jeitos. -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo } = React;

    /* ===== CRM FloreSer — funil comercial + cadência de follow-up ===== */

    /* Cada cor é uma variável CSS: o estilo inline continua igual, mas o
       valor passa a depender do tema ativo. */
    const CORES = {
      floresta: "var(--crm-floresta)",
      verde: "var(--crm-verde)",
      ouro: "var(--crm-ouro)",
      areia: "var(--crm-areia)",
      branco: "var(--crm-branco)",
      atrasado: "var(--crm-atrasado)",
      borda: "var(--crm-borda)",
      suave: "var(--crm-suave)",
      suaveForte: "var(--crm-suave-forte)",
      /* o texto principal deixa de ser o verde-floresta no escuro */
      texto: "var(--crm-texto)",
      superficie: "var(--crm-superficie)",
      superficie2: "var(--crm-superficie-2)",
      sobreEscuro: "var(--crm-sobre-escuro)",
      verdeFundo: "var(--crm-verde-fundo)",
      sobreVerde: "var(--crm-sobre-verde)",
    };

    const STORAGE_KEY = "crm-floreser-dados";

    function pedidoDaBarra(chave) {
      try {
        const v = new URLSearchParams(location.search).get(chave);
        return v ? String(v) : "";
      } catch (e) { return ""; }
    }

    function limparBarra() {
      /* sem isto, todo recarregamento reabriria a mesma ficha */
      try { history.replaceState(null, "", location.pathname); } catch (e) { }
    }

    /* A última versão que o servidor confirmou. Numa disputa é ela que diz
       o que foi mexido aqui e o que foi mexido lá. Vive só na memória. */
    var BASE_CRM = null;
    var tentativasDeMerge = 0;

    /* contatos é lista por id, como leads: dois aparelhos registrando ao
       mesmo tempo somam, em vez de um apagar o evento do outro */
    const ESQUEMA_CRM = { listas: { leads: "id", contatos: "id" } };

    /* ---- A etapa decide junto com o que depende dela ----
       O merge de três vias compara campo a campo, e para a etapa isso não
       basta. "Falta" num aparelho e "Fazer orçamento" no outro dão conflito
       na etapa — mas a cadência (Quente, de um lado) e o comparecimento
       (carimbado do outro) passariam sozinhos, e qualquer escolha terminaria
       incoerente: Falta com comparecimento, ou Fazer orçamento com cadência.

       Então a etapa é UMA pergunta, e o que ela arrasta segue o lado
       escolhido: cadência, data do atendimento e marcos do funil.

       Também vira pergunta a etapa mudada de um lado enquanto o outro mudava
       a data do atendimento: marcar Falta aqui enquanto alguém reagendava lá
       não é coisa para o sistema juntar sozinho.

       Mudanças que não se cruzam continuam passando sem pergunta: reagendar
       num aparelho e mexer nas observações no outro guarda as duas. */
    const CAMPOS_DA_ETAPA = ["cadencia", "dataAgendada", "dtConversa", "dtAgendamento",
      "dtComparecimento", "dtVenda", "dtReprovado"];

    function amarrarEtapas(m, base, local, servidor) {
      const indexar = (estado) => {
        const mapa = {};
        ((estado && estado.leads) || []).forEach((l) => { if (l && l.id) mapa[String(l.id)] = l; });
        return mapa;
      };
      const B = indexar(base), L = indexar(local), S = indexar(servidor);
      const mudou = (antes, depois, campo) => !FloreSerSync.iguais(antes[campo], depois[campo]);
      const daEtapa = (c) => c.tipo === "campo" && c.lista === "leads" && c.campo === "etapa";

      const emDisputa = {};
      m.conflitos.forEach((c) => { if (daEtapa(c)) emDisputa[c.id] = "etapa"; });
      Object.keys(L).forEach((id) => {
        if (emDisputa[id] || !B[id] || !S[id]) return;
        const b = B[id], l = L[id], s = S[id];
        const etapaAqui = mudou(b, l, "etapa"), etapaLa = mudou(b, s, "etapa");
        if ((etapaAqui && !etapaLa && mudou(b, s, "dataAgendada")) ||
          (etapaLa && !etapaAqui && mudou(b, l, "dataAgendada"))) {
          emDisputa[id] = "cruzada";
        }
      });

      const conflitos = m.conflitos.filter((c) =>
        !(c.tipo === "campo" && c.lista === "leads" && emDisputa[c.id] && CAMPOS_DA_ETAPA.includes(c.campo)));
      Object.keys(emDisputa).forEach((id) => {
        if (emDisputa[id] !== "cruzada") return;
        conflitos.push({
          tipo: "campo", lista: "leads", id: id, campo: "etapa",
          rotuloRegistro: L[id].nome || S[id].nome || id,
          base: B[id].etapa, local: L[id].etapa, servidor: S[id].etapa,
        });
      });

      /* Depois das escolhas: a etapa e tudo o que ela arrasta vêm inteiros do
         lado escolhido. Por último, cadência que não pertence à etapa não
         fica — em nenhuma lead que o merge tocou. */
      function finalizar(estado, escolhas) {
        const saida = estado;
        const porId = indexar(saida);
        conflitos.forEach((c, i) => {
          if (!daEtapa(c) || !emDisputa[c.id]) return;
          const fonte = (escolhas[i] === "local" ? L : S)[c.id];
          const alvo = porId[c.id];
          if (!fonte || !alvo) return;
          ["etapa"].concat(CAMPOS_DA_ETAPA).forEach((k) => {
            alvo[k] = fonte[k] === undefined ? "" : FloreSerSync.copiar(fonte[k]);
          });
        });

        const tocadas = {};
        m.automaticos.forEach((a) => { if (a.lista === "leads") tocadas[a.id] = true; });
        conflitos.forEach((c) => { if (c.lista === "leads") tocadas[c.id] = true; });
        (saida.leads || []).forEach((l) => {
          if (tocadas[String(l.id)]) l.cadencia = cadenciaValida(l.etapa, l.cadencia);
        });
        return saida;
      }

      return { conflitos: conflitos, finalizar: finalizar };
    }

    /* O que conta como cadastro repetido no CRM.

       O WhatsApp é forte: número igual é quase sempre a mesma pessoa, e
       dois cadastros com o mesmo número quebram a cadência — a mensagem
       sai duas vezes para quem já respondeu.

       O nome é fraco: Maria Silva existe muitas vezes. Avisa, nunca impede. */
    const CRITERIOS_REPETIDO_CRM = [
      { forca: "forte", texto: "mesmo WhatsApp",
        campos: [{ campo: "whatsapp", como: "telefone" }] },
      { forca: "fraca", texto: "mesmo nome",
        campos: [{ campo: "nome", como: "nome" }] },
    ];

    const ROTULOS_CRM = {
      campos: {
        nome: "Nome", whatsapp: "WhatsApp", etapa: "Etapa do funil",
        cadencia: "Cadência", ultimoContato: "Último contato", observacoes: "Observações",
        interesse: "Interesse",
        origem: "Origem", exCliente: "Ex-cliente", criadoEm: "Cadastrada em",
        dtConversa: "1ª conversa", dtAgendamento: "Agendou em",
        dataAgendada: "Data do atendimento",
        dtComparecimento: "Comparecimento", dtVenda: "Venda",
        dtReprovado: "Reprovada em", historico: "Histórico",
      },
      valores: {
        etapa: {}, cadencia: {}, origem: {},
        exCliente: { true: "sim", false: "não" },
      },
    };

    /* ---- Cadências: da mais quente para a mais fria ---- */
    const CADENCIAS = [
      { id: "quente", nome: "Quente", padrao: 2 },
      { id: "morno", nome: "Morno", padrao: 5 },
      { id: "frio", nome: "Frio", padrao: 15 },
      { id: "muito_frio", nome: "Muito frio", padrao: 30 },
    ];

    /* ---- Etapas do funil ----
       cadencias: quais cadências a etapa aceita, na ordem de esfriamento
       nivel: até onde o lead chegou no funil. Cada marco é carimbado UMA
              vez, na data em que aconteceu, e nunca é reescrito — por isso
              agendar carimba conversa e agendamento no mesmo dia, e o
              comparecimento semanas depois não duplica o agendamento.
              null quer dizer que a etapa não carimba nada novo: o que já
              foi carimbado continua valendo.
       comercial: quem cuida da lead enquanto ela está nesta etapa — ver
              comercialDaEtapa(), logo abaixo. null é o arquivo.
       arquivo: sai do dia a dia, mas continua salvo                      */
    /* preenche os rótulos do comparador com o que as tabelas já dizem */
    function prepararRotulos() {
      ETAPAS.forEach(function (e) { ROTULOS_CRM.valores.etapa[e.id] = e.nome; });
      CADENCIAS.forEach(function (c) { ROTULOS_CRM.valores.cadencia[c.id] = c.nome; });
      ORIGENS.forEach(function (o) { ROTULOS_CRM.valores.origem[o.id] = o.nome; });
    }

    /* Fazer orçamento e Em aberto são coisas diferentes, e a diferença é o
       fluxo inteiro:
         Fazer orçamento — ela compareceu e o orçamento AINDA PRECISA SER
                           PREPARADO. É do Comercial 2, não tem cadência e
                           fica no topo da fila até alguém concluir.
         Em aberto       — o orçamento JÁ EXISTE e foi apresentado; o
                           Comercial 1 acompanha a decisão, com cadência.
       A antiga "Com orçamento" (com_orcamento) era a segunda, e continua
       migrando para Em aberto — nunca para Fazer orçamento. */
    const ETAPAS = [
      { id: "nao_responde", nome: "Não responde", cadencias: ["quente", "morno", "frio", "muito_frio"], nivel: null, comercial: 1 },
      { id: "conversando", nome: "Conversando", cadencias: ["quente"], nivel: 1, comercial: 1 },
      { id: "nurturing", nome: "Nurturing", cadencias: ["frio", "muito_frio"], nivel: null, comercial: 1 },
      { id: "agendado", nome: "Agendado", cadencias: [], nivel: 2, comercial: 2 },
      { id: "falta", nome: "Falta", cadencias: ["quente"], nivel: null, comercial: 1 },
      { id: "fazer_orcamento", nome: "Fazer orçamento", cadencias: [], nivel: 3, comercial: 2 },
      { id: "em_aberto", nome: "Em aberto", cadencias: ["quente", "morno", "frio", "muito_frio"], nivel: 3, comercial: 1 },
      { id: "venda", nome: "Venda", cadencias: [], nivel: 4, arquivo: true, comercial: null },
      { id: "venda_reprovada", nome: "Venda reprovada", cadencias: [], nivel: 3, arquivo: true, encerra: true, comercial: null },
      { id: "recusado", nome: "Recusado", cadencias: [], nivel: null, arquivo: true, encerra: true, comercial: null },
    ];

    /* ---- Quem cuida da lead agora ----
       As duas filas de trabalho. A responsabilidade NÃO é gravada na lead:
       ela sai da etapa, sempre, por comercialDaEtapa(). Gravar
       "responsavel" em cada cadastro abriria espaço para uma lead em Falta
       aparecer como do Comercial 2 — duas verdades que um dia discordam.

       Quando existirem contas presas a uma fila, a regra entra aqui: qual
       destas filas cada conta enxerga. O resto do CRM já pergunta tudo por
       comercialDaEtapa(). */
    const COMERCIAIS = [
      { id: 1, nome: "Comercial 1", papel: "Relacionamento e acompanhamento" },
      { id: 2, nome: "Comercial 2", papel: "Atendimentos agendados e orçamentos" },
    ];

    function comercialDaEtapa(etapaId) {
      return etapaPor(etapaId).comercial || null;
    }

    function nomeDoResponsavel(etapaId) {
      const n = comercialDaEtapa(etapaId);
      const c = COMERCIAIS.find((x) => x.id === n);
      return c ? c.nome : "Arquivo";
    }

    /* Os passos do dia a dia a partir de cada etapa. É o que o seletor da
       ficha oferece; qualquer outra etapa continua possível, mas só pela
       correção manual, que existe para consertar cadastro.

       Agendado não tem seletor: antes do atendimento a ação é a data, e
       depois dele a pergunta tem só duas respostas — DESFECHOS_DO_ATENDIMENTO.
       Fazer orçamento também não: a saída é "Orçamento feito". */
    const PROXIMAS_ETAPAS = {
      nao_responde: ["conversando", "nurturing", "agendado", "recusado"],
      conversando: ["nao_responde", "nurturing", "agendado", "recusado"],
      nurturing: ["nao_responde", "conversando", "agendado", "recusado"],
      falta: ["agendado", "nao_responde", "conversando", "nurturing", "recusado"],
      em_aberto: ["venda", "venda_reprovada", "recusado"],
      agendado: [],
      fazer_orcamento: [],
      venda: [],
      venda_reprovada: [],
      recusado: [],
    };

    /* Depois do dia do atendimento, só existem duas perguntas possíveis:
       ela faltou, ou compareceu e precisa de orçamento? */
    const DESFECHOS_DO_ATENDIMENTO = ["falta", "fazer_orcamento"];

    /* ---- De onde a cliente veio ---- */
    const ORIGENS = [
      { id: "instagram", nome: "Instagram" },
      { id: "radio", nome: "Rádio" },
      { id: "vale_presente", nome: "Vale-presente" },
      { id: "indicacao", nome: "Indicação" },
      { id: "google", nome: "Google" },
      { id: "outros", nome: "Outros" },
    ];
    const origemPor = (id) => ORIGENS.find((o) => o.id === id);

    const MARCOS = ["criadoEm", "dtConversa", "dtAgendamento", "dtComparecimento", "dtVenda"];

    const etapaPor = (id) => ETAPAS.find((e) => e.id === id) || ETAPAS[0];
    const cadenciaPor = (id) => CADENCIAS.find((c) => c.id === id);

    /* ---- Datas ---- */
    /* O dia no relógio de quem está usando, nunca em UTC: um contato feito
       às 22h não pode cair no dia seguinte. "quando" é opcional — serve para
       o evento de contato tirar data e hora do MESMO instante. */
    function hojeISO(quando) {
      const d = quando || new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function paraData(iso) {
      if (!iso) return null;
      const [y, m, d] = String(iso).split("-").map(Number);
      if (!y || !m || !d) return null;
      return new Date(y, m - 1, d);
    }
    function diasDesde(iso) {
      const data = paraData(iso);
      if (!data) return null;
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      return Math.floor((hoje - data) / 86400000);
    }
    function formatarData(iso) {
      if (!iso) return "—";
      const [y, m, d] = String(iso).split("-");
      return d && m ? `${d}/${m}/${y}` : "—";
    }
    function dataValida(iso) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(iso || "")) && !!paraData(iso);
    }
    /* "hoje", "ontem", "em 4 dias", "há 3 dias": a distância que se lê de
       relance, contada em dias do calendário e não em horas */
    function distancia(iso, hoje) {
      const d = paraData(iso), h = paraData(hoje);
      if (!d || !h) return "";
      const n = Math.round((d - h) / 86400000);
      if (n === 0) return "hoje";
      if (n === 1) return "amanhã";
      if (n === -1) return "ontem";
      return n > 1 ? `em ${n} dias` : `há ${-n} dias`;
    }
    function inicioDaSemana() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - d.getDay());
      return d;
    }
    function inicioDoMes() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), 1);
    }
    function novoId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    /* ---- Contatos registrados ----
       Cada toque em "Contatei" vira um evento com id próprio, guardado junto
       com os dados do CRM. É dele que sai "quantos contatos foram feitos
       hoje" — e não de ultimoContato, que nasce preenchido num cadastro
       novo, vem pronto numa importação e pode ser editado à mão.

       O id precisa ser único entre aparelhos que registram no mesmo
       segundo: o relógio sozinho não garante, então vão junto 48 bits
       sorteados pelo próprio navegador. */
    function novoIdContato(quando) {
      const d = quando || new Date();
      let sorte = "";
      try {
        sorte = Array.from(window.crypto.getRandomValues(new Uint8Array(6)),
          (b) => b.toString(16).padStart(2, "0")).join("");
      } catch (e) {
        sorte = (Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2)).slice(0, 12);
      }
      return "contato_" + hojeISO(d).replace(/-/g, "") + "_" + d.getTime().toString(36) + sorte;
    }

    /* data e hora locais, com o fuso escrito: 2026-09-16T20:31:42-03:00 */
    function momentoLocal(quando) {
      const d = quando || new Date();
      const dois = (n) => String(n).padStart(2, "0");
      const fuso = -d.getTimezoneOffset();
      const sinal = fuso >= 0 ? "+" : "-";
      const abs = Math.abs(fuso);
      return `${hojeISO(d)}T${dois(d.getHours())}:${dois(d.getMinutes())}:${dois(d.getSeconds())}` +
        `${sinal}${dois(Math.floor(abs / 60))}:${dois(abs % 60)}`;
    }

    /* Aceita o que vier do servidor — inclusive nada, que é o caso de todo
       CRM criado antes desta funcionalidade — e devolve sempre a mesma forma.
       Nada é reconstruído a partir de ultimoContato: contato que não foi
       registrado pelo botão não é inventado. */
    function normalizarContatos(lista) {
      if (!Array.isArray(lista)) return [];
      return lista
        .filter((c) => c && c.id && c.leadId && /^\d{4}-\d{2}-\d{2}$/.test(String(c.data || "")))
        .map((c) => ({
          id: String(c.id),
          leadId: String(c.leadId),
          data: String(c.data),
          criadoEm: String(c.criadoEm || ""),
        }));
    }

    function plural(n, um, varios) {
      return n === 1 ? um : varios;
    }

    const NOMES_MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho",
      "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

    function nomeDoMes(chave) {
      const [ano, mes] = String(chave).split("-").map(Number);
      if (!ano || !mes) return chave;
      const nome = NOMES_MESES[mes - 1];
      return `${nome.charAt(0).toUpperCase()}${nome.slice(1)} de ${ano}`;
    }

    /* ---- Regras de cadência ---- */
    function cadenciaValida(etapaId, cadenciaId) {
      const permitidas = etapaPor(etapaId).cadencias;
      if (!permitidas.length) return "";
      return permitidas.includes(cadenciaId) ? cadenciaId : permitidas[0];
    }
    function proximaCadencia(etapaId, cadenciaId) {
      const permitidas = etapaPor(etapaId).cadencias;
      if (!permitidas.length) return "";
      const i = permitidas.indexOf(cadenciaId);
      if (i === -1) return permitidas[0];
      return permitidas[Math.min(i + 1, permitidas.length - 1)];
    }

    /* a etapa trabalha por cadência, e a lead tem uma: é aí que cabe "Contatei" */
    function temCadencia(lead) {
      return etapaPor(lead.etapa).cadencias.length > 0 && !!lead.cadencia;
    }

    /* ---- Situação do follow-up ----
       Só para etapas com cadência. Agendado e Fazer orçamento têm a própria
       situação, em situacaoComercial2() — uma cadência que sobrou gravada
       numa lead agendada não pode colocá-la na fila de contatos. */
    function situacao(lead, dias) {
      const etapa = etapaPor(lead.etapa);
      if (etapa.arquivo) return { tipo: "arquivado", texto: "Arquivado", atraso: -9999 };
      if (!temCadencia(lead)) return { tipo: "sem-cadencia", texto: "Sem cadência", atraso: -9999 };
      const intervalo = dias[lead.cadencia] || cadenciaPor(lead.cadencia)?.padrao || 5;
      const passados = diasDesde(lead.ultimoContato);
      if (passados === null) return { tipo: "atrasado", texto: "Nunca contatada", atraso: 999 };
      const restam = intervalo - passados;
      if (restam < 0) return { tipo: "atrasado", texto: `Atrasado ${-restam}d`, atraso: -restam };
      if (restam === 0) return { tipo: "hoje", texto: "Contatar hoje", atraso: 0 };
      return { tipo: "em-dia", texto: `Em ${restam}d`, atraso: -restam };
    }

    /* ---- A fila do Comercial 2 ----
       Não é cadência. Agendado e Fazer orçamento não esfriam e não têm
       "próximo contato": a ordem sai da prioridade e da data do atendimento.

       A data é dataAgendada — o dia em que a pessoa vem à clínica. NÃO é
       dtAgendamento, que é o marco do funil: o dia em que a lead foi
       agendada. Marcar hoje para daqui a uma semana dá dtAgendamento hoje e
       dataAgendada daqui a uma semana.

       Uma tabela só diz a ordem dos grupos e quais pedem ação agora; o
       badge da aba e a ordenação leem daqui. */
    const FILA_COMERCIAL2 = {
      orcamento: { ordem: 0, acao: true, titulo: "Prioridade · fazer orçamento" },
      sem_data: { ordem: 1, acao: true, titulo: "Sem data do atendimento" },
      passou: { ordem: 2, acao: true, titulo: "O atendimento já passou" },
      hoje: { ordem: 3, acao: false, titulo: "Atendimento hoje" },
      futuro: { ordem: 4, acao: false, titulo: "Próximos atendimentos" },
    };

    function situacaoComercial2(lead, hoje) {
      const dia = hoje || hojeISO();
      const montar = (tipo, chave, texto) => ({ tipo, chave: chave || "", texto, ...FILA_COMERCIAL2[tipo] });

      if (lead.etapa === "fazer_orcamento") {
        /* o mais antigo primeiro: orçamento esquecido é o que mais custa */
        const c = lead.dtComparecimento;
        const texto = !dataValida(c) ? "Orçamento a fazer"
          : c === dia ? "Compareceu hoje"
            : `Compareceu em ${formatarData(c)} · ${distancia(c, dia)}`;
        return montar("orcamento", c || lead.dataAgendada || lead.criadoEm, texto);
      }
      if (lead.etapa !== "agendado") return null;

      const d = lead.dataAgendada;
      /* Lead de antes desta versão não tem a data. Ela NÃO é inventada a
         partir de dtAgendamento: isso trocaria "quando marcou" por "quando
         vem", e o CRM passaria a cobrar desfecho de quem ainda nem veio. */
      if (!dataValida(d)) return montar("sem_data", lead.dtAgendamento || lead.criadoEm, "Data do atendimento não informada");
      if (d < dia) return montar("passou", d, `Atendimento em ${formatarData(d)} · ${distancia(d, dia)}`);
      if (d === dia) return montar("hoje", d, "Atendimento hoje");
      return montar("futuro", d, `${formatarData(d)} · ${distancia(d, dia)}`);
    }

    /* A única ordenação do Comercial 2: grupo, depois a data dentro dele
       (a mais antiga primeiro — no futuro, isso é a mais próxima), depois o
       nome, para a lista não pular de lugar entre um desenho e outro. */
    function compararComercial2(a, b) {
      return (a.sit2.ordem - b.sit2.ordem) ||
        String(a.sit2.chave).localeCompare(String(b.sit2.chave)) ||
        String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR");
    }

    /* ---- Marcos do funil: carimba as datas conforme o lead avança ----
       "quando" é o dia do carimbo; sem ele, hoje. */
    function aplicarMarcos(lead, etapaId, quando) {
      const etapa = etapaPor(etapaId);
      const dia = quando || hojeISO();
      const atualizado = { ...lead };
      if (etapa.encerra) atualizado.dtReprovado = atualizado.dtReprovado || hojeISO();
      const nivel = etapa.nivel;
      if (nivel === null || nivel === undefined) return atualizado;
      for (let i = 1; i <= nivel; i++) {
        const campo = MARCOS[i];
        if (!atualizado[campo]) atualizado[campo] = dia;
      }
      return atualizado;
    }

    /* ---- Mudar de etapa: um lugar só ----
       Toda troca de etapa passa por aqui — o seletor, os botões do
       Comercial 2, a correção manual. A cadência se ajusta à etapa nova e
       os marcos do funil são carimbados.

       Quem volta ao Comercial 1 vindo de uma etapa sem cadência (Agendado
       virando Falta, Fazer orçamento virando Em aberto) entra na primeira
       cadência da etapa, a mais quente: cadenciaValida() dá isso, porque a
       cadência vazia não pertence a etapa nenhuma que tenha cadência.

       Comparecer é o que Fazer orçamento significa. Vindo de Agendado com o
       dia do atendimento já chegado, o comparecimento leva a data do
       atendimento, e não a do clique de quem registrou no dia seguinte.
       Comparecimento que já existia nunca é reescrito.

       "extras" são campos que mudam junto — a data do atendimento, ao
       agendar. dtAgendamento e dataAgendada ficam como estão em Falta:
       faltar não apaga que houve um agendamento. */
    function aplicarEtapa(lead, etapaId, extras) {
      const hoje = hojeISO();
      const base = { ...lead, ...(extras || {}) };
      const doAtendimento = etapaId === "fazer_orcamento" && lead.etapa === "agendado" &&
        dataValida(lead.dataAgendada) && lead.dataAgendada <= hoje;
      return aplicarMarcos(
        { ...base, etapa: etapaId, cadencia: cadenciaValida(etapaId, base.cadencia) },
        etapaId,
        doAtendimento ? lead.dataAgendada : hoje
      );
    }

    /* o indicador é o mesmo dos três módulos, montado fora do React */
    var statusCRM = null;

    function CRMFloreSer() {
      const caixaQuem = React.useRef(null);
      const caixaStatus = React.useRef(null);

      const [carregando, setCarregando] = useState(true);
      const [erro, setErro] = useState(null);
      const [leads, setLeads] = useState([]);
      const [dias, setDias] = useState(() => CADENCIAS.reduce((a, c) => ({ ...a, [c.id]: c.padrao }), {}));
      const [contatos, setContatos] = useState([]);
      /* O valor mais novo da lista, sem esperar o React redesenhar: dois
         registros no mesmo instante não podem partir da mesma lista velha,
         senão o segundo apagaria o primeiro antes de sair do navegador. */
      const contatosRef = React.useRef([]);
      /* registro em andamento, por lead: segura o duplo clique acidental */
      const contatoEmCurso = React.useRef({});
      /* a gravação com o estado do desenho mais recente, para quem vive fora
         do React (o indicador de status, montado uma vez só) */
      const salvarAtual = React.useRef(() => { });
      /* o dia de hoje, conferido de minuto em minuto: a meia-noite zera a
         contagem mesmo com a página aberta desde ontem */
      const [dia, setDia] = useState(() => hojeISO());
      const [aba, setAba] = useState("funil");
      const [periodo, setPeriodo] = useState("semana");
      const [mesRef, setMesRef] = useState(() => hojeISO().slice(0, 7));
      const [filtroEtapa, setFiltroEtapa] = useState("todas");
      /* "todos", 1 ou 2: a aba Leads continua sendo a visão geral */
      const [filtroComercial, setFiltroComercial] = useState("todos");
      const [busca, setBusca] = useState("");
      const [editando, setEditando] = useState(null);
      /* a data do atendimento sendo pedida: null, ou { lead, modo } */
      const [atendimento, setAtendimento] = useState(null);
      /* a conversa da integração com a Agenda: null, ou o que falta decidir */
      const [integrando, setIntegrando] = useState(null);
      const [aberto, setAberto] = useState(null);
      const [importando, setImportando] = useState(false);
      const [faixaAberta, setFaixaAberta] = useState(null);
      const [recado, setRecado] = useState("");

      /* a marca "Amanda ▾" é montada fora do React, pelo auth.js, para os três
         módulos usarem exatamente o mesmo componente */
      useEffect(() => {
        if (ORIGEM_SESSAO.tipo !== "usuario" || !caixaQuem.current) return;
        if (caixaQuem.current.childElementCount) return;
        window.FloreSerAuth.montarIdentidade(caixaQuem.current, function () { location.reload(); });
        /* depende de "carregando": o cabeçalho só existe depois da tela de espera */
      }, [carregando]);

      /* o indicador nasce junto com o cabeçalho */
      useEffect(() => {
        if (!caixaStatus.current || statusCRM) return;
        prepararRotulos();
        statusCRM = FloreSerSync.criarStatus(caixaStatus.current, {});

        /* Com conflito adiado, tocar no indicador traz a resolução de volta. */
        const caixa = caixaStatus.current;
        caixa.style.cursor = "pointer";
        caixa.setAttribute("role", "button");
        caixa.setAttribute("tabindex", "0");
        /* Pelo ref, e não pela função deste desenho: este efeito roda uma
           vez só, e a função que ele enxergasse ficaria presa aos leads da
           hora em que a página abriu — regravar com ela desfaria tudo o que
           foi feito depois. */
        const reabrir = () => {
          if (statusCRM.estado() !== "conflito" || FloreSerSync.conflitoAberto()) return;
          if (!FloreSerSync.reabrirConflito()) salvarAtual.current();
        };
        caixa.addEventListener("click", reabrir);
        caixa.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); reabrir(); }
        });

        /* o cabeçalho só existe depois da carga; se os dados já chegaram,
           o estado certo é "salvo", não "carregando" */
        if (!carregando) statusCRM.salvoAgora();
      }, [carregando]);

      function definirContatos(lista) {
        contatosRef.current = lista;
        setContatos(lista);
      }

      useEffect(() => {
        const conferir = () => {
          const agora = hojeISO();
          setDia((anterior) => (anterior === agora ? anterior : agora));
        };
        const relogio = setInterval(conferir, 60000);
        /* aba que volta do fundo confere na hora, sem esperar o minuto */
        document.addEventListener("visibilitychange", conferir);
        return () => {
          clearInterval(relogio);
          document.removeEventListener("visibilitychange", conferir);
        };
      }, []);

      useEffect(() => {
        (async () => {
          try {
            const res = await window.storage.get(STORAGE_KEY);
            let d = null;
            if (res && res.value) {
              d = JSON.parse(res.value);
              /* CRM de antes desta funcionalidade não tem contatos: vira lista
                 vazia só em memória. Nada é gravado por ter aberto a página —
                 a forma nova sobe junto com a próxima alteração de verdade. */
              d.contatos = normalizarContatos(d.contatos);
              if (d.dias) setDias((atual) => ({ ...atual, ...d.dias }));
              if (d.leads) setLeads(d.leads.map(migrar));
              definirContatos(d.contatos);
              /* o que acabou de chegar é o que o servidor tem */
              BASE_CRM = FloreSerSync.copiar(d);
            }
            if (statusCRM) statusCRM.salvoAgora();

            /* A busca do portal manda o id na barra. Só o id: nome e
               telefone não têm o que fazer ali, e token nenhum jamais.
               Vale para lead arquivada também — a ficha é a mesma. */
            const pedida = pedidoDaBarra("lead");
            if (pedida) {
              limparBarra();
              const achada = (d && d.leads ? d.leads.map(migrar) : []).find((l) => l.id === pedida);
              if (achada) setAberto(achada);
              else setRecado("O lead deste link não está mais no CRM.");
            }
          } catch (e) {
            /* Aqui NÃO é primeiro uso: storage.get só lança quando o
               servidor recusou. Uma planilha vazia responde ok, com lista
               vazia. Mostrar o funil zerado neste caso faria parecer que os
               leads sumiram. */
            setErro("Não foi possível carregar os leads. O servidor recusou a " +
              "leitura — os dados continuam na planilha. Recarregue a página " +
              "para tentar de novo.");
          } finally {
            setCarregando(false);
          }
        })();
      }, []);

      /* converte cadastros do formato antigo */
      function migrar(l) {
        if (l.etapa === "reprovado") return { ...l, etapa: "recusado" };
        /* Agendando saiu: quem estava lá volta para Conversando */
        if (l.etapa === "agendando") return { ...l, etapa: "conversando", cadencia: "quente" };
        /* Com orçamento e Em aberto viraram a mesma coisa */
        if (l.etapa === "com_orcamento") return { ...l, etapa: "em_aberto" };
        if (l.etapa) return l;
        const antigo = { c1: "quente", c2: "morno", c3: "frio" };
        return {
          ...l,
          etapa: "nao_responde",
          cadencia: antigo[l.categoriaId] || "quente",
          exCliente: false,
          criadoEm: l.criadoEm || hojeISO(),
        };
      }

      /* A tela anda na hora e o envio vai atrás — mas o status só diz
         "salvo" quando o servidor confirma. Se der conflito, as duas
         versões são comparadas em vez de a página recarregar. */
      async function salvar(novosLeads, novosDias) {
        return salvarEstado({ leads: novosLeads, dias: novosDias });
      }

      /* O estado do CRM tem três partes — leads, dias e contatos — e uma
         alteração pode mexer em mais de uma. Tudo o que muda junto vai numa
         gravação só: o lead com o último contato novo e o evento que conta o
         contato nunca sobem separados, então não existe "atualizou o lead mas
         não contou" nem o contrário. O que não foi informado segue como está.

         Devolve true quando o servidor confirmou — inclusive depois de uma
         conciliação automática. Quem precisa encadear outra operação (marcar
         na Agenda a data que acabou de ir para o CRM) só segue com true. */
      async function salvarEstado(mudancas) {
        const m = mudancas || {};
        const lds = m.leads ?? leads;
        const ds = m.dias ?? dias;
        const cts = m.contatos ?? contatosRef.current;
        if (m.leads) setLeads(m.leads);
        if (m.dias) setDias(m.dias);
        if (m.contatos) definirContatos(m.contatos);
        return gravar({ leads: lds, dias: ds, contatos: cts });
      }
      salvarAtual.current = () => salvarEstado({});

      async function gravar(estado) {
        if (statusCRM) statusCRM.definir("salvando");
        try {
          await window.storage.set(STORAGE_KEY, JSON.stringify(estado));
          BASE_CRM = FloreSerSync.copiar(estado);
          tentativasDeMerge = 0;
          setErro(null);
          if (statusCRM) statusCRM.salvoAgora();
          return true;
        } catch (e) {
          if (e && e.conflito) return conciliar(estado, e);

          if (e && e.motivo === "sem_acesso") {
            if (statusCRM) statusCRM.definir("semAcesso");
            setErro("Seu acesso ao CRM foi retirado. O que está na tela continua aqui, " +
              "mas não sobe mais para a planilha — fale com quem administra o sistema.");
            return false;
          }
          if (e && (e.motivo === "sessao" || e.motivo === "expirada" || e.motivo === "inativo")) {
            if (statusCRM) statusCRM.definir("expirado");
            setErro("Sua sessão expirou. Copie o que ainda não foi salvo, recarregue a página e entre de novo.");
            return false;
          }

          /* rede caiu, ou o servidor recusou: são coisas diferentes */
          const semRede = e instanceof TypeError;
          if (statusCRM) statusCRM.definir(semRede ? "offline" : "erro");
          setErro(semRede
            ? "Sem conexão com o servidor. As alterações continuam aqui — tente de novo quando voltar."
            : "O servidor recusou a gravação. As alterações continuam aqui — tente de novo.");
          return false;
        }
      }

      /* Devolve true só quando a versão conciliada já foi aceita. Com
         pergunta aberta para a pessoa, ainda não foi: devolve false, e a
         resolução grava sozinha depois. */
      async function conciliar(local, falha) {
        const servidor = falha.dados;
        if (!servidor) {
          if (statusCRM) statusCRM.definir("conflito");
          setErro("Outro aparelho alterou os leads. Recarregue para ver a versão mais recente.");
          return false;
        }

        const base = BASE_CRM || local;

        /* Um Apps Script que ainda não conhece os contatos responde sem essa
           lista. Ele não pode ter apagado o que nunca guardou — então, para o
           merge, é como se não tivesse mexido neles. Tratar a ausência como
           lista vazia faria os contatos daqui sumirem no primeiro conflito. */
        servidor.contatos = Array.isArray(servidor.contatos)
          ? normalizarContatos(servidor.contatos)
          : ((base && base.contatos) || []);

        const m = FloreSerSync.mesclar(base, local, servidor, ESQUEMA_CRM);
        const etapas = amarrarEtapas(m, base, local, servidor);

        /* Contato registrado nunca vira pergunta: tem id único e não é editado
           depois. Fica fora da contagem de "conciliados sozinho", que é sobre
           as fichas — senão um conflito numa etapa anunciaria dez conciliações
           só porque alguém registrou dez contatos em outro aparelho. */
        const automaticosDasFichas = m.automaticos.filter((a) => a.lista !== "contatos");

        anotarSync("SYNC_CONFLITO_DETECTADO",
          etapas.conflitos.length + " campo(s) em disputa, " + automaticosDasFichas.length + " conciliado(s) sozinho");

        if (!etapas.conflitos.length) {
          anotarSync("SYNC_CONFLITO_AUTO_MESCLADO", automaticosDasFichas.length + " alteração(ões)");
          return aplicarMerge(etapas.finalizar(m.estado, []), falha.rev);
        }

        if (statusCRM) statusCRM.definir("conflito");
        setErro(null);
        FloreSerSync.abrirConflito({
          conflitos: etapas.conflitos, automaticos: automaticosDasFichas, rotulos: ROTULOS_CRM,
          aviso: "Os leads foram alterados em outro aparelho enquanto você trabalhava. " +
            "O que não se cruzou já foi juntado; escolha o que fica no que sobrou.",
          aoResolver: async function (escolhas) {
            const escolhido = FloreSerSync.aplicarEscolhas(m.estado, etapas.conflitos, escolhas, ESQUEMA_CRM);
            anotarSync("SYNC_CONFLITO_RESOLVIDO_MANUAL",
              escolhas.filter((e) => e === "local").length + " de " + escolhas.length +
              " campo(s) ficaram com a versão deste aparelho");
            await aplicarMerge(etapas.finalizar(escolhido, escolhas), falha.rev);
          },
          aoCancelar: function () {
            if (statusCRM) statusCRM.definir("conflito");
            setErro('Conflito guardado. Toque em "Conflito de alterações", no topo, para resolver.');
          },
        });
        return false;
      }

      async function aplicarMerge(estado, rev) {
        setLeads((estado.leads || []).map(migrar));
        if (estado.dias) setDias((atual) => ({ ...atual, ...estado.dias }));
        /* o merge já juntou os contatos dos dois lados: os daqui e os de lá */
        estado.contatos = normalizarContatos(estado.contatos);
        definirContatos(estado.contatos);
        SESSAO.rev = rev;

        tentativasDeMerge++;
        if (tentativasDeMerge > 4) {
          if (statusCRM) statusCRM.definir("conflito");
          setErro("Os dados continuam sendo alterados por outra pessoa. Revise antes de salvar.");
          return false;
        }
        return gravar(estado);
      }

      function anotarSync(evento, mensagem) {
        const r = window.FloreSerLogs && window.FloreSerLogs.registrar;
        if (r) r(evento, { mensagem: "crm · " + mensagem });
      }

      /* O formulário é a correção manual da ficha: aceita qualquer etapa, e
         Agendado só sai dele com a data do atendimento preenchida. A troca de
         etapa é a mesma do resto do CRM, a partir de como a lead estava. */
      function salvarLead(dados) {
        const antes = dados.id ? leads.find((l) => l.id === dados.id) : null;
        const preparado = aplicarEtapa({ ...dados, etapa: antes ? antes.etapa : dados.etapa }, dados.etapa);
        conferirRepetido(preparado, dados.id, () => gravarLead(preparado, dados.id));
      }

      function gravarLead(preparado, id) {
        if (id) {
          salvar(leads.map((l) => (l.id === id ? { ...l, ...preparado } : l)));
        } else {
          salvar([...leads, { ...preparado, id: novoId(), criadoEm: preparado.criadoEm || hojeISO() }]);
        }
        setEditando(null);
        setAberto(null);
      }

      /* O que já está guardado e parece com o que a pessoa acabou de digitar.
         Vale tanto para cadastro novo quanto para edição — trocar o telefone
         de alguém para o de outra lead é a mesma colisão, e ninguém repara
         nela sem aviso. */
      function repetidosLocais(candidato, id) {
        return FloreSerSync.procurarRepetidos(candidato, leads, {
          id: "id",
          ignorarId: id,
          criterios: CRITERIOS_REPETIDO_CRM,
          situacao: (l) => (etapaPor(l.etapa).arquivo ? "está no arquivo" : ""),
        });
      }

      /* A lixeira não vem para o navegador — quem lista é o painel de
         manutenção. Então perguntamos ao servidor apenas se existe algo
         parecido lá, e ele responde nome, motivo e prazo. Se a pergunta
         falhar, o aviso segue com o que dá para conferir aqui: melhor um
         aviso incompleto do que nenhum. */
      async function repetidosNaLixeira(candidato) {
        try {
          const r = await chamarAPI({
            acao: "repetido_na_lixeira", token: SESSAO.token, tipo: "crm",
            whatsapp: candidato.whatsapp || "", nome: candidato.nome || "",
          });
          if (!r || !r.ok || !Array.isArray(r.achados)) return [];
          return r.achados.map((a) => ({
            registro: { nome: a.titulo },
            forca: a.forca === "forte" ? "forte" : "fraca",
            motivo: a.motivo,
            situacao: "na lixeira · " + a.diasRestantes +
              (a.diasRestantes === 1 ? " dia para expirar" : " dias para expirar"),
            podeAbrir: false,
          }));
        } catch (e) {
          return [];
        }
      }

      async function conferirRepetido(candidato, id, seguir) {
        const antes = id ? leads.find((l) => l.id === id) : null;
        const zapNovo = FloreSerSync.telefone(candidato.whatsapp);
        const zapAntes = FloreSerSync.telefone(antes && antes.whatsapp);
        /* editar sem mexer no telefone nem no nome não precisa de conferência */
        const mudouOQueImporta = !antes ||
          zapNovo !== zapAntes ||
          FloreSerSync.nomeChave(candidato.nome) !== FloreSerSync.nomeChave(antes.nome);
        if (!mudouOQueImporta) { seguir(); return; }

        const achados = repetidosLocais(candidato, id)
          .concat(await repetidosNaLixeira(candidato));
        if (!achados.length) { seguir(); return; }

        const forte = achados.some((a) => a.forca === "forte");
        anotarSync("REPETIDO_AVISADO",
          achados.length + " parecido(s), " + (forte ? "com" : "sem") + " coincidência forte");

        FloreSerSync.avisarRepetido({
          achados: achados,
          titulo: forte ? "Já existe um cadastro com esse WhatsApp" : "Já existe alguém com esse nome",
          aviso: forte
            ? "Dois cadastros com o mesmo número recebem a cadência duas vezes. Confira se não é a mesma pessoa."
            : "Nome igual acontece — pode ser outra pessoa. Confira antes de seguir.",
          textoSeguir: id ? "Salvar mesmo assim" : "Cadastrar mesmo assim",
          rotulo: (l) => l.nome || "(sem nome)",
          detalhe: (l) => {
            if (!l.whatsapp) return "";
            return "WhatsApp " + l.whatsapp +
              (l.etapa ? " · " + etapaPor(l.etapa).nome : "");
          },
          aoVer: (l) => { setEditando(null); setAberto(l); },
          aoSeguir: () => { anotarSync("REPETIDO_SEGUIU", "a pessoa optou por salvar assim mesmo"); seguir(); },
          aoCancelar: () => { },
        });
      }

      /* Toda troca de etapa feita na tela passa por aqui: o seletor da
         ficha, a correção manual, os desfechos do atendimento e "Orçamento
         feito". Entrar em Agendado nunca é direto — antes vem a data do
         atendimento, que é o que faz a fila do Comercial 2 funcionar. */
      function mudarEtapa(id, etapaId) {
        const lead = leads.find((l) => l.id === id);
        if (!lead || lead.etapa === etapaId) return;
        if (etapaId === "agendado") { pedirAtendimento(lead, "entrar"); return; }
        salvar(leads.map((l) => (l.id === id ? aplicarEtapa(l, etapaId) : l)));
        avisarPassagem(lead, etapaId);
      }

      /* Quem muda de fila precisa saber para onde foi: a lead sai da tela em
         que a pessoa estava, e sem aviso parece que sumiu. */
      function avisarPassagem(lead, etapaId) {
        const nome = lead.nome || "A lead";
        const etapa = etapaPor(etapaId);
        if (etapaId === "fazer_orcamento") {
          setRecado(`${nome} está no topo do Comercial 2: fazer orçamento.`);
          return;
        }
        const para = comercialDaEtapa(etapaId);
        if (!para || para === comercialDaEtapa(lead.etapa)) return;
        const cad = cadenciaPor(cadenciaValida(etapaId, lead.cadencia));
        setRecado(`${nome} passou para o ${nomeDoResponsavel(etapaId)}: ${etapa.nome}` +
          (cad ? `, cadência ${cad.nome}.` : "."));
      }

      /* A data do atendimento: ao entrar em Agendado, ao informar a que
         falta numa lead antiga e ao remarcar. modo: entrar | informar | alterar */
      function pedirAtendimento(lead, modo) {
        setAberto(null);
        setAtendimento({ lead: lead, modo: modo });
      }

      /* Salva a data no CRM e, se pedido, leva a MESMA data para a Agenda.
         Os dois lados saem do mesmo campo, então não nascem diferentes.

         A ordem importa: primeiro o CRM, e só com a gravação confirmada a
         Agenda. Se o CRM não confirmou (sem rede, conflito esperando
         decisão), a Agenda não é tocada — uma agenda marcada para uma lead
         que o CRM não registrou seria justamente as duas datas soltas. */
      async function confirmarAtendimento(id, data, agenda) {
        const lead = leads.find((l) => l.id === id);
        setAtendimento(null);
        if (!lead || !dataValida(data)) return;

        const jaAgendada = lead.etapa === "agendado";
        const anterior = jaAgendada ? (lead.dataAgendada || "") : "";
        const atualizado = jaAgendada
          ? { ...lead, dataAgendada: data }
          : aplicarEtapa(lead, "agendado", { dataAgendada: data });

        let salvou = true;
        if (!FloreSerSync.iguais(atualizado, lead)) {
          salvou = await salvar(leads.map((l) => (l.id === id ? atualizado : l)));
        }
        if (!jaAgendada) avisarPassagem(lead, "agendado");
        else if (anterior !== data) setRecado(`Atendimento de ${lead.nome || "a lead"} marcado para ${formatarData(data)}.`);

        if (!agenda) return;
        if (!salvou) {
          setRecado("A data ainda não foi confirmada no CRM, então a Agenda não foi alterada. " +
            "Quando o CRM salvar, use Vincular à Agenda na ficha.");
          return;
        }
        setIntegrando({ etapa: "enviando", lead: atualizado });
        await integrarNaAgenda({
          leadId: id, area: agenda.area, data: data, freq: agenda.freq,
          dataAnterior: anterior, atualizarData: true,
        });
      }

      /* A integração grava nos dois módulos, então exige as duas permissões.
         Aqui só se decide o que mostrar; quem confere de verdade é o
         servidor, que recusa a operação de quem não tem as duas. */
      function podeIntegrar() {
        const auth = window.FloreSerAuth;
        if (!auth || !auth.token()) return false;      /* senha compartilhada não serve */
        return auth.possuiPermissao("crm") && auth.possuiPermissao("agenda");
      }

      function convidarParaAgenda(lead) {
        if (!lead) return;
        if (!podeIntegrar()) {
          /* botão que só falharia não ajuda ninguém */
          const auth = window.FloreSerAuth;
          if (auth && auth.token() && !auth.possuiPermissao("agenda")) {
            setRecado("Entre com uma conta com acesso à Agenda para integrar este cadastro.");
          }
          return;
        }
        setIntegrando({ etapa: "convite", lead: lead });
      }

      /* A chamada é uma só, e o servidor faz tudo de uma vez: encontra ou
         cria a paciente, prende o vínculo, atualiza os dois módulos e sobe
         as duas revisões. Fazer em dois pedidos deixaria a porta aberta
         para o CRM mudar e a Agenda não. */
      async function integrarNaAgenda(pedido) {
        setIntegrando((a) => ({ ...a, etapa: "enviando" }));
        try {
          const r = await chamarAPI(Object.assign({
            acao: "crm_agenda_agendar", token: SESSAO.token,
          }, pedido));

          if (!r || !r.ok) {
            setIntegrando((a) => ({ ...a, etapa: "erro",
              mensagem: r && r.erro === "sem_acesso"
                ? "Sua conta não tem acesso aos dois módulos."
                : "Não foi possível concluir agora. Tente de novo." }));
            return;
          }

          if (r.precisaDecidir) {
            setIntegrando((a) => ({ ...a, etapa: "parecidas", parecidas: r.parecidas,
              pedido: pedido }));
            return;
          }

          /* já vinculada e ninguém pediu para levar a data: só avisa e
             oferece abrir a ficha */
          if (r.jaVinculada && !r.agendou && !pedido.atualizarData) {
            setIntegrando((a) => ({ ...a, etapa: "jaVinculada",
              pacienteId: r.pacienteId, pacienteNome: r.pacienteNome }));
            return;
          }

          /* o servidor mexeu nos dois lados: o CRM daqui precisa recarregar
             para não gravar por cima com a versão antiga */
          if (typeof r.crmRev === "number") SESSAO.rev = r.crmRev;
          await recarregarDoServidor();

          setIntegrando(null);
          const quando = r.data ? " · atendimento em " + formatarData(r.data) : "";
          setRecado((r.criado ? "Paciente criada e vinculada na Agenda: "
            : r.jaEstava ? "A Agenda já estava com esse atendimento: "
              : r.jaVinculada ? "Agenda atualizada: "
                : "Paciente vinculada na Agenda: ") + r.pacienteNome + quando + ".");
        } catch (e) {
          setIntegrando((a) => ({ ...a, etapa: "erro",
            mensagem: "Sem conexão com o servidor. Tente de novo." }));
        }
      }

      /* Depois de o servidor mexer no CRM por fora, a tela precisa da versão
         dele — senão o próximo salvamento daqui desfaria a integração. */
      async function recarregarDoServidor() {
        try {
          const res = await window.storage.get(STORAGE_KEY);
          if (res && res.value) {
            const d = JSON.parse(res.value);
            d.contatos = normalizarContatos(d.contatos);
            if (d.leads) setLeads(d.leads.map(migrar));
            if (d.dias) setDias((atual) => ({ ...atual, ...d.dias }));
            definirContatos(d.contatos);
            BASE_CRM = FloreSerSync.copiar(d);
            if (statusCRM) statusCRM.salvoAgora();
          }
        } catch (e) {
          setErro("A integração foi feita, mas não consegui recarregar os leads. " +
            "Recarregue a página para ver o resultado.");
        }
      }

      function mudarCadencia(id, cadenciaId) {
        salvar(leads.map((l) => (l.id === id ? { ...l, cadencia: cadenciaId } : l)));
      }

      function alternarExCliente(id) {
        salvar(leads.map((l) => (l.id === id ? { ...l, exCliente: !l.exCliente } : l)));
      }

      /* Registra contato e esfria um degrau, dentro do limite da etapa — como
         sempre fez. Agora também deixa um evento do contato, que é o que a
         contagem do dia soma. As duas coisas saem na mesma gravação.

         Esta é a ÚNICA origem de evento de contato. Criar lead, importar,
         editar o último contato à mão, mudar etapa ou cadência, abrir o
         WhatsApp, restaurar da lixeira, sincronizar e resolver conflito não
         passam por aqui — e por isso não contam. */
      function registrarContato(id) {
        /* Dois cliques colados chegariam antes de a tela redesenhar e virariam
           dois contatos. Enquanto o registro deste lead está sendo gravado, o
           segundo toque é ignorado; terminado, registrar de novo no mesmo dia
           continua valendo — é outro contato de verdade. */
        if (contatoEmCurso.current[id]) return;
        /* Agendado e Fazer orçamento não trabalham por cadência: ali não há
           contato a registrar. O botão nem aparece; isto segura um cartão que
           ficou na tela de antes de a etapa mudar. */
        const alvo = leads.find((l) => l.id === id);
        if (!alvo || !temCadencia(alvo)) return;
        contatoEmCurso.current[id] = true;

        const agora = new Date();
        const evento = {
          id: novoIdContato(agora),
          leadId: id,
          data: hojeISO(agora),
          criadoEm: momentoLocal(agora),
        };

        salvarEstado({
          leads: leads.map((l) =>
            l.id === id ? { ...l, ultimoContato: hojeISO(agora), cadencia: proximaCadencia(l.etapa, l.cadencia) } : l
          ),
          contatos: [...contatosRef.current, evento],
        }).finally(() => {
          delete contatoEmCurso.current[id];
        });
      }

      /* Mover para a lixeira é operação do servidor: ele tira o lead da aba,
         guarda o cadastro inteiro e devolve a revisão nova. Aqui só refletimos
         o que ele já fez — nada é reenviado, para não ressuscitar o registro. */
      async function moverLeadParaLixeira(id, motivo) {
        const lead = leads.find((l) => l.id === id);
        try {
          const r = await chamarAPI({
            acao: "lixeira_mover", token: SESSAO.token, tipo: "crm", id: id, motivo: motivo || "",
          });
          if (!r || !r.ok) {
            setErro(r && r.erro === "sem_acesso"
              ? "Você não possui acesso a este módulo."
              : "Não foi possível concluir a operação. Tente novamente.");
            return;
          }
          if (typeof r.rev === "number") SESSAO.rev = r.rev;
          setLeads(leads.filter((l) => l.id !== id));
          setAberto(null);
          setEditando(null);
          setErro(null);
          /* o nome do lead pode ser de qualquer pessoa: frase sem gênero */
          setRecado((lead ? lead.nome : "O lead") +
            " está na lixeira — dá para restaurar no painel de manutenção por 30 dias.");
        } catch (e) {
          setErro("Não foi possível concluir a operação. Tente novamente.");
        }
      }

      /* Planilha grande repete muito: a mesma pessoa em duas linhas, ou
         alguém que já está no funil. Entram só as que sobram, e a tela diz
         quantas ficaram de fora e por quê — sem perguntar linha a linha. */
      function importarLeads(novos) {
        const analise = FloreSerSync.analisarImportacao(novos, leads, {
          id: "id",
          criterios: [CRITERIOS_REPETIDO_CRM[0]],   /* na importação, só o forte */
        });

        const entram = analise.entram.map((n) => aplicarMarcos({ ...n, id: novoId() }, n.etapa));
        if (entram.length) salvar([...leads, ...entram]);

        setImportando(false);
        setAba("leads");

        /* Agendado sem data entra assim mesmo — a planilha é o que é — e a
           tela diz onde elas estão: no Comercial 2, pedindo a data. */
        const semData = entram.filter((l) => l.etapa === "agendado" && !dataValida(l.dataAgendada)).length;
        const avisoSemData = !semData ? ""
          : " " + (semData === 1 ? "1 lead em Agendado chegou" : semData + " leads em Agendado chegaram") +
          " sem a data do atendimento e " + (semData === 1 ? "está" : "estão") +
          " no Comercial 2, esperando essa data.";

        if (!analise.repetidos.length) {
          setRecado((entram.length === 1
            ? "1 lead importado."
            : entram.length + " leads importados.") + avisoSemData);
        } else {
          const fora = analise.repetidos.length;
          anotarSync("IMPORTACAO_REPETIDOS",
            fora + " linha(s) fora por WhatsApp repetido, " + entram.length + " importada(s)");
          setRecado(
            (entram.length === 1 ? "1 lead importado" : entram.length + " leads importados") +
            " · " + (fora === 1 ? "1 linha ficou de fora" : fora + " linhas ficaram de fora") +
            " por já existir cadastro com o mesmo WhatsApp: " +
            analise.repetidos.slice(0, 5).map((r) => r.registro.nome || "(sem nome)").join(", ") +
            (fora > 5 ? " e mais " + (fora - 5) + "." : ".") + avisoSemData);
        }
      }

      /* "dia" entra nas dependências só para a lista ser recalculada à
         meia-noite com a página aberta — a regra de quem fica pendente é a
         mesma de sempre. Sem isto, o resumo zeraria os contatos do dia novo
         e continuaria mostrando os pendentes de ontem. */
      const comSituacao = useMemo(() => leads.map((l) => ({
        ...l, sit: situacao(l, dias), sit2: situacaoComercial2(l, dia),
      })), [leads, dias, dia]);
      const ativos = comSituacao.filter((l) => !etapaPor(l.etapa).arquivo);
      const arquivados = comSituacao.filter((l) => etapaPor(l.etapa).arquivo);

      /* Uma lead, uma fila: quem decide é a etapa. As duas listas saem da
         mesma lista de leads — ninguém é copiado para lá e para cá. */
      const fila1 = ativos.filter((l) => comercialDaEtapa(l.etapa) === 1);
      const fila2 = ativos.filter((l) => comercialDaEtapa(l.etapa) === 2).sort(compararComercial2);

      /* Comercial 1: a cadência de sempre — atrasados, depois os de hoje.
         O número da aba é isto, não o tamanho da fila inteira. */
      const pendentes = fila1
        .filter((l) => l.sit.tipo === "atrasado" || l.sit.tipo === "hoje")
        .sort((a, b) => b.sit.atraso - a.sit.atraso);

      /* Comercial 2: o que pede ação agora. Atendimento futuro não entra, e
         o de hoje também não — ele ainda não aconteceu. */
      const acoes2 = fila2.filter((l) => l.sit2.acao);

      /* Cada evento é um contato: a mesma lead contatada duas vezes hoje soma
         dois. Contatos de ontem continuam guardados; só não entram aqui. */
      const contatosHoje = useMemo(
        () => contatos.filter((c) => c.data === dia).length,
        [contatos, dia]
      );

      const filtrados = ativos
        .filter((l) => filtroComercial === "todos" || comercialDaEtapa(l.etapa) === filtroComercial)
        .filter((l) => filtroEtapa === "todas" || l.etapa === filtroEtapa)
        .filter((l) => l.nome.toLowerCase().includes(busca.toLowerCase()))
        .sort((a, b) => b.sit.atraso - a.sit.atraso);

      const funil = useMemo(() => {
        let de = null;
        let ate = null;
        if (periodo === "semana") {
          de = inicioDaSemana();
        } else if (periodo === "mes") {
          const [ano, mes] = mesRef.split("-").map(Number);
          de = new Date(ano, mes - 1, 1);
          ate = new Date(ano, mes, 1);
        }
        const dentro = (iso) => {
          if (!iso) return false;
          const d = paraData(iso);
          if (!d) return false;
          if (de && d < de) return false;
          if (ate && d >= ate) return false;
          return true;
        };
        /* cada faixa guarda os leads, não só a conta: é o que permite
           abrir a lista de quem está sendo contado ali */
        const faixas = [
          { rotulo: "Leads captados", campo: "criadoEm" },
          { rotulo: "Conversas", campo: "dtConversa" },
          { rotulo: "Agendamentos", campo: "dtAgendamento" },
          { rotulo: "Comparecimentos", campo: "dtComparecimento" },
          { rotulo: "Vendas", campo: "dtVenda" },
        ].map((f) => ({ ...f, leads: leads.filter((l) => dentro(l[f.campo])) }));

        const captados = faixas[0].leads;
        const vendas = faixas[4].leads;

        const origens = ORIGENS
          .map((o) => ({ ...o, qtd: captados.filter((l) => l.origem === o.id).length }))
          .concat([{ id: "", nome: "Não informado", qtd: captados.filter((l) => !l.origem).length }])
          .filter((o) => o.qtd > 0);

        return {
          faixas,
          origens,
          totalCaptados: captados.length,
          porConsulta: vendas.filter((l) => !l.exCliente).length,
          porRecompra: vendas.filter((l) => l.exCliente).length,
        };
      }, [leads, periodo, mesRef]);

      /* meses disponíveis: do primeiro lead captado até o mês atual */
      const mesesDisponiveis = useMemo(() => {
        const atual = hojeISO().slice(0, 7);
        const datas = leads.map((l) => String(l.criadoEm || "").slice(0, 7)).filter((m) => /^\d{4}-\d{2}$/.test(m));
        const inicio = datas.length ? datas.sort()[0] : atual;
        const lista = [];
        let [ano, mes] = inicio.split("-").map(Number);
        const [anoFim, mesFim] = atual.split("-").map(Number);
        let guarda = 0;
        while ((ano < anoFim || (ano === anoFim && mes <= mesFim)) && guarda++ < 120) {
          lista.push(`${ano}-${String(mes).padStart(2, "0")}`);
          mes++;
          if (mes > 12) { mes = 1; ano++; }
        }
        return lista.reverse();
      }, [leads]);

      if (carregando) {
        return (
          <div style={{ minHeight: "100vh", background: CORES.areia, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Montserrat', sans-serif", color: CORES.verde }}>
            Carregando…
          </div>
        );
      }

      const rotuloPeriodo =
        periodo === "semana" ? "nesta semana"
          : periodo === "mes" ? `em ${nomeDoMes(mesRef).toLowerCase()}`
            : "em todo o período";

      return (
        <div style={{ minHeight: "100vh", background: CORES.areia, fontFamily: "'Montserrat', -apple-system, sans-serif", color: CORES.texto }}>
          <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        input, select, textarea, button { font-family: 'Montserrat', sans-serif; }
        input:focus, select:focus, textarea:focus { outline: 2px solid ${CORES.verde}; outline-offset: 1px; }
        button { cursor: pointer; }

        /* acabamento no mesmo tom do portal */
        .cartao-lead {
          box-shadow: 0 1px 2px rgba(45,45,45,.04), 0 8px 22px rgba(59,110,106,.07);
          transition: border-color .2s ease, box-shadow .24s ease, transform .24s ease;
        }
        .painel-claro {
          box-shadow: 0 1px 2px rgba(45,45,45,.04), 0 8px 22px rgba(59,110,106,.07);
        }
        .pilula { transition: background .18s ease, color .18s ease; }
        @media (hover: hover) {
          .faixa:not([disabled]):hover { filter: brightness(1.12); }
        }
        .acao { transition: background .18s ease, border-color .18s ease, box-shadow .2s ease; }

        @media (hover: hover) {
          .cartao-lead:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 4px rgba(45,45,45,.05), 0 14px 32px rgba(59,110,106,.13);
          }
          .pilula:hover { background: rgba(245,243,238,0.22); }
          .acao:hover { box-shadow: 0 6px 16px rgba(59,110,106,.18); }
        }

        @keyframes surgir-crm { from { opacity: 0; transform: translateY(8px); } }
        main > section { animation: surgir-crm .42s ease both; }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { animation: none !important; transition: none !important; }
        }
      `}</style>

          <header style={{ background: CORES.floresta, color: CORES.sobreEscuro, padding: "26px 20px 18px" }}>
            <div style={{ maxWidth: 760, margin: "0 auto" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase", color: "var(--crm-topo-rotulo)" }}>
                  Clínica Corpo e Alma
                </div>
                <a href="../" style={{ marginLeft: "auto", fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--crm-topo-rotulo)", textDecoration: "none" }}>
                  ‹ Início
                </a>
                <span ref={caixaStatus} style={{ fontSize: 11, letterSpacing: "0.06em", color: "var(--crm-topo-tag)" }}></span>
                <span ref={caixaQuem} style={{ display: "inline-flex" }}></span>
                <button onClick={sairDoCRM} title="Encerrar a sessão neste aparelho"
                  hidden={ORIGEM_SESSAO.tipo === "usuario"}
                  style={{ border: "none", background: "none", fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--crm-topo-rotulo)", padding: 0, cursor: "pointer" }}>
                  Sair
                </button>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 14, marginTop: 3 }}>
                <img src="../logo.png" width="366" height="380" alt=""
                  style={{ height: 42, width: "auto", filter: "brightness(0) invert(1)", opacity: .9 }} />
                <div>
                  <h1 style={{ fontFamily: "'Cormorant Garamond', serif", fontWeight: 600, fontSize: 32, margin: 0, lineHeight: 1.1 }}>
                    CRM Flore<span style={{ fontStyle: "italic", color: "var(--crm-topo-serif)" }}>Ser</span>
                  </h1>
                  <div style={{ fontSize: 9.5, letterSpacing: "0.28em", textTransform: "uppercase", color: "var(--crm-topo-tag)", marginTop: 4 }}>
                    Funil comercial
                  </div>

                    <span style={{ flex: 1, fontWeight: 600, fontSize: 15 }}>{c.nome}</span>

          {aberto && !editando && (() => {
            /* a ficha sempre com a lead de agora, não com a foto de quando

            const atual = comSituacao.find((l) => l.id === aberto.id) || aberto;

          {integrando && (

          )}

          {editando && (
            <Modal aoFechar={() => setEditando(null)}>
              <FormularioLead lead={editando === "novo" ? null : editando} aoSalvar={salvarLead} aoCancelar={() => setEditando(null)} />
            </Modal>
          )}
