      );
    }

    /* ==== Gráfico de funil — cada faixa abre a lista de quem está nela ==== */
    function GraficoFunil({ faixas, mostrarPercentual, aoAbrirFaixa }) {
      const maximo = Math.max(...faixas.map((f) => f.leads.length), 1);
      const tons = ["var(--crm-faixa-1)", "var(--crm-faixa-2)", "var(--crm-faixa-3)",
        "var(--crm-faixa-4)", "var(--crm-faixa-5)"];

      return (
        <div className="painel-claro" style={{ background: CORES.branco, borderRadius: 12, border: `1px solid ${CORES.borda}`, padding: "18px 16px" }}>
          {faixas.map((f, i) => {
            const valor = f.leads.length;
            const largura = Math.max((valor / maximo) * 100, valor > 0 ? 16 : 8);
            const anterior = i > 0 ? faixas[i - 1].leads.length : null;
            const conv = anterior ? Math.round((valor / anterior) * 100) : null;
            return (
              <div key={f.rotulo} style={{ marginBottom: i === faixas.length - 1 ? 0 : 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}>
                  <span style={{ fontWeight: 600 }}>{f.rotulo}</span>
                  {mostrarPercentual && conv !== null && anterior > 0 && (
                    <span style={{ color: CORES.suave }}>{conv}% da etapa anterior</span>
                  )}
                </div>
                <div style={{ display: "flex", justifyContent: "center" }}>
                  <button className="faixa" onClick={() => valor > 0 && aoAbrirFaixa(f)}
                    disabled={valor === 0}
                    title={valor > 0 ? "Ver quem está nesta faixa" : ""}
                    style={{
                      width: `${largura}%`, background: tons[i], color: CORES.sobreVerde, borderRadius: 6, border: "none",
                      padding: "9px 12px", textAlign: "center", fontWeight: 700, fontSize: 16, minWidth: 54,
                      transition: "width 0.3s, filter .18s ease", cursor: valor > 0 ? "pointer" : "default"
                    }}>
                    {valor}
                  </button>
                </div>
              </div>
            );
          })}
          <div style={{ textAlign: "center", fontSize: 11.5, color: "var(--crm-fantasma)", marginTop: 12 }}>
            Toque em uma faixa para ver quem está nela
          </div>
        </div>
      );
    }

    /* ==== Gráfico de origem ==== */
    function GraficoOrigem({ origens, total }) {
      if (!origens.length) {
        return (
          <div className="painel-claro" style={{
            background: CORES.branco, borderRadius: 12, border: `1px solid ${CORES.borda}`,
            padding: "20px 16px", textAlign: "center", fontSize: 13, color: CORES.suave
          }}>
            Nenhum lead captado neste período.
          </div>
        );
      }
      const maximo = Math.max(...origens.map((o) => o.qtd), 1);
      const tons = {
        instagram: "var(--crm-origem-instagram)", radio: "var(--crm-origem-radio)",
        vale_presente: "var(--crm-origem-vale)", indicacao: "var(--crm-origem-indicacao)",
        google: "var(--crm-origem-google)", outros: "var(--crm-origem-outros)",
        "": "var(--crm-origem-sem)"
      };

      return (
        <div className="painel-claro" style={{ background: CORES.branco, borderRadius: 12, border: `1px solid ${CORES.borda}`, padding: "16px" }}>
          {origens.map((o, i) => (
            <div key={o.id || "sem"} style={{ marginBottom: i === origens.length - 1 ? 0 : 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 4 }}>
                <span style={{ fontWeight: 600, color: o.id ? CORES.texto : CORES.suave }}>{o.nome}</span>
                <span style={{ color: CORES.suave }}>
                  {o.qtd} · {total ? Math.round((o.qtd / total) * 100) : 0}%
                </span>
              </div>
              <div style={{ background: CORES.superficie2, borderRadius: 5, height: 10, overflow: "hidden" }}>
                <div style={{ width: `${(o.qtd / maximo) * 100}%`, background: tons[o.id] || CORES.verde, height: "100%", transition: "width 0.3s" }} />
              </div>
            </div>
          ))}
        </div>
      );
    }

    /* ==== Quem está sendo contado numa faixa do funil ==== */
    function ListaDaFaixa({ faixa, aoAbrirLead }) {
      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: "0 0 2px" }}>{faixa.rotulo}</h3>
          <p style={{ fontSize: 12.5, color: CORES.suave, margin: "0 0 14px" }}>
            {faixa.leads.length} lead{faixa.leads.length !== 1 ? "s" : ""} no período escolhido, com a data em que essa etapa aconteceu.
          </p>
          {faixa.leads
            .slice()
            .sort((a, b) => String(a[faixa.campo]).localeCompare(String(b[faixa.campo])))
            .map((l) => (
              <button key={l.id} className="cartao-lead" onClick={() => aoAbrirLead(l)}
                style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, width: "100%",
                  background: CORES.branco, border: `1px solid ${CORES.borda}`, borderRadius: 10, padding: "10px 13px",
                  marginBottom: 7, textAlign: "left"
                }}>
                <span style={{ minWidth: 0 }}>
                  <span style={{ display: "block", fontWeight: 600, fontSize: 14, color: CORES.texto }}>{l.nome}</span>
                  <span style={{ fontSize: 11.5, color: CORES.suave }}>
                    {etapaPor(l.etapa).nome}{l.exCliente ? " · ex-cliente" : ""}
                  </span>
                </span>
                <span style={{ fontSize: 12.5, color: CORES.verde, whiteSpace: "nowrap" }}>{formatarData(l[faixa.campo])}</span>
              </button>
            ))}
        </div>
      );
    }

    function Indicador({ rotulo, valor, nota }) {
      return (
        <div className="painel-claro" style={{ background: CORES.branco, borderRadius: 12, border: `1px solid ${CORES.borda}`, padding: "14px 16px" }}>
          <div style={{ fontSize: 11.5, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: CORES.suave }}>{rotulo}</div>
          <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 34, fontWeight: 600, color: CORES.texto, lineHeight: 1.1, marginTop: 2 }}>{valor}</div>
          <div style={{ fontSize: 12, color: CORES.verde }}>{nota}</div>
        </div>
      );
    }

    /* O que já foi feito hoje ao lado do que ainda falta. O número nunca
       aparece sozinho — a frase inteira está no texto, para quem lê a tela
       e para quem ouve. Zero também aparece: dia sem contato é informação. */
    function ResumoDoDia({ feitos, pendentes }) {
      return (
        <div className="crm-resumo-dia" aria-live="polite" aria-atomic="true">
          <div className="crm-resumo-item crm-resumo-feitos painel-claro">
            <span className="crm-resumo-numero">{feitos}</span>
            <span className="crm-resumo-rotulo">
              {plural(feitos, "contato feito hoje", "contatos feitos hoje")}
            </span>
          </div>
          <div className="crm-resumo-item painel-claro">
            <span className="crm-resumo-numero">{pendentes}</span>
            <span className="crm-resumo-rotulo">
              {plural(pendentes, "contato pendente agora", "contatos pendentes agora")}
            </span>
          </div>
        </div>
      );
    }

    /* O mesmo desenho do resumo do Comercial 1, com o que conta aqui: o que
       pede ação agora vem primeiro, e o que ainda não chegou vem por último.
       "Sem data" só aparece quando existe — é resto de cadastro antigo. */
    function ResumoComercial2({ fila }) {
      const conta = (tipo) => fila.filter((l) => l.sit2.tipo === tipo).length;
      const orcamentos = conta("orcamento");
      const passaram = conta("passou");
      const semData = conta("sem_data");
      const hoje = conta("hoje");
      return (
        <div className="crm-resumo-dia" aria-live="polite" aria-atomic="true">
          <div className="crm-resumo-item crm-resumo-prioridade painel-claro">
            <span className="crm-resumo-numero">{orcamentos}</span>
            <span className="crm-resumo-rotulo">{plural(orcamentos, "orçamento a fazer", "orçamentos a fazer")}</span>
          </div>
          <div className="crm-resumo-item painel-claro">
            <span className="crm-resumo-numero">{passaram}</span>
            <span className="crm-resumo-rotulo">{plural(passaram, "atendimento esperando o resultado", "atendimentos esperando o resultado")}</span>
          </div>
          {semData > 0 && (
            <div className="crm-resumo-item painel-claro">
              <span className="crm-resumo-numero">{semData}</span>
              <span className="crm-resumo-rotulo">{plural(semData, "agendamento sem data", "agendamentos sem data")}</span>
            </div>
          )}
          <div className="crm-resumo-item painel-claro">
            <span className="crm-resumo-numero">{hoje}</span>
            <span className="crm-resumo-rotulo">{plural(hoje, "atendimento hoje", "atendimentos hoje")}</span>
          </div>
        </div>
      );
    }

    /* A aba de uma fila mostra o que pede ação; a fila inteira está na aba
       Leads, com o filtro já escolhido. */
    function VerFilaInteira({ quantos, texto, aoVer }) {
      if (!quantos) return null;
      return (
        <div style={{ textAlign: "right", marginTop: 6 }}>
          <button onClick={aoVer}
            style={{ border: "none", background: "none", color: CORES.verde, fontSize: 12.5, fontWeight: 600, padding: "6px 0" }}>
            {texto} ({quantos}) →
          </button>
        </div>
      );
    }

    /* Um ícone de alerta em traço fino, como os do portão — sem emoji */
    function IconeAlerta() {
      return (
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="1.8" strokeLinecap="round" aria-hidden="true" style={{ flex: "0 0 auto" }}>
          <path d="M12 3.8 21 19.5H3L12 3.8Z" />
          <path d="M12 10v4M12 16.6v.4" />
        </svg>
      );
    }

    /* ==== A fila do Comercial 2 ====
       Os grupos na ordem de FILA_COMERCIAL2. A prioridade está, antes de
       tudo, na POSIÇÃO: Fazer orçamento é sempre o primeiro bloco. A cor
       só acompanha. */
    function FilaComercial2({ fila, aoAbrir, aoDesfecho, aoOrcamentoFeito, aoInformarData }) {
      const grupos = Object.keys(FILA_COMERCIAL2)
        .sort((a, b) => FILA_COMERCIAL2[a].ordem - FILA_COMERCIAL2[b].ordem)
        .map((tipo) => ({ tipo, ...FILA_COMERCIAL2[tipo], leads: fila.filter((l) => l.sit2.tipo === tipo) }))
        .filter((g) => g.leads.length);

      return grupos.map((g) => (
        <div key={g.tipo} className={"crm-c2-grupo crm-c2-grupo-" + g.tipo}>
          <h3 className="crm-c2-titulo">
            {g.titulo}
            <span className="crm-c2-conta">{g.leads.length}</span>
          </h3>
          {g.leads.map((l) => (
            <CartaoComercial2 key={l.id} lead={l}
              aoAbrir={() => aoAbrir(l)}
              aoDesfecho={(etapaId) => aoDesfecho(l, etapaId)}
              aoOrcamentoFeito={() => aoOrcamentoFeito(l)}
              aoInformarData={() => aoInformarData(l)} />
          ))}
        </div>
      ));
    }

    function CartaoComercial2({ lead, aoAbrir, aoDesfecho, aoOrcamentoFeito, aoInformarData }) {
      const s = lead.sit2;
      const etapa = etapaPor(lead.etapa);
      return (
        <div className={"cartao-lead crm-c2-cartao crm-c2-" + s.tipo}>
          <button className="crm-c2-quem" onClick={aoAbrir}>
            <span className="crm-c2-nome">{lead.nome}</span>
            <span className="crm-c2-linha">
              <Etiqueta texto={etapa.nome} cor={CORES.texto} fundo="var(--crm-etiqueta-bg)" />
              {s.tipo === "orcamento" && <Etiqueta texto="Prioridade" cor="var(--crm-ouro-texto)" fundo="var(--crm-etiqueta-ouro-bg)" />}
              {lead.exCliente && <Etiqueta texto="Ex-cliente" cor={CORES.ouro} fundo="var(--crm-etiqueta-ouro-bg)" />}
              <span className="crm-c2-quando">
                {s.tipo === "sem_data" && <IconeAlerta />}
                {s.texto}
              </span>
            </span>
          </button>

          {s.tipo === "orcamento" && (
            <div className="crm-c2-acoes">
              <button className="crm-botao crm-botao-cheio" onClick={aoOrcamentoFeito}
                title="O orçamento está pronto: a lead volta para o Comercial 1, em Em aberto">
                Orçamento feito
              </button>
            </div>
          )}
          {s.tipo === "sem_data" && (
            <div className="crm-c2-acoes">
              <button className="crm-botao" onClick={aoInformarData}>Informar data</button>
            </div>
          )}
          {s.tipo === "passou" && (
            <div className="crm-c2-decisao">
              <span className="crm-c2-pergunta">O que aconteceu?</span>
              <div className="crm-c2-acoes crm-c2-acoes-par">
                {DESFECHOS_DO_ATENDIMENTO.map((id) => (
                  <button key={id} className="crm-botao" onClick={() => aoDesfecho(id)}>
                    {etapaPor(id).nome}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function Vazio({ titulo, texto }) {
      return (
        <div style={{ background: CORES.branco, borderRadius: 12, padding: "36px 20px", textAlign: "center", border: `1px solid ${CORES.borda}` }}>
          <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 22, color: CORES.verde }}>{titulo}</div>
          <div style={{ fontSize: 13, color: CORES.suave, marginTop: 6 }}>{texto}</div>
        </div>
      );
    }

    /* ==== Cartão ==== */
    function Etiqueta({ texto, cor, fundo }) {
      return (
        <span style={{
          fontSize: 10.5, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase",
          color: cor, background: fundo, padding: "3px 8px", borderRadius: 10, whiteSpace: "nowrap"
        }}>
          {texto}
        </span>
      );
    }

    function CartaoLead({ lead, aoAbrir, aoContatar, semContato }) {
      const etapa = etapaPor(lead.etapa);
      /* cadência só se a etapa trabalha com ela: uma sobra gravada numa lead
         agendada não aparece como se valesse */
      const cad = temCadencia(lead) ? cadenciaPor(lead.cadencia) : null;
      /* etapa do Comercial 2 fala da data do atendimento, não de cadência */
      const s = lead.sit2 || lead.sit;
      const corSit = lead.sit2
        ? (s.acao ? "var(--crm-ouro-texto)" : CORES.verde)
        : s.tipo === "atrasado" ? CORES.atrasado : s.tipo === "hoje" ? CORES.ouro : CORES.verde;

      return (
        <div className="cartao-lead" style={{ background: CORES.branco, borderRadius: 12, border: `1px solid ${CORES.borda}`, padding: "13px 15px", marginBottom: 10, display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={aoAbrir} style={{ flex: 1, textAlign: "left", border: "none", background: "none", padding: 0, minWidth: 0 }}>
            <div style={{ fontWeight: 600, fontSize: 15, color: CORES.texto }}>{lead.nome}</div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 5, alignItems: "center" }}>
              <Etiqueta texto={etapa.nome} cor={CORES.texto} fundo="var(--crm-etiqueta-bg)" />
              {lead.exCliente && <Etiqueta texto="Ex-cliente" cor={CORES.ouro} fundo="var(--crm-etiqueta-ouro-bg)" />}
              {cad && <Etiqueta texto={cad.nome} cor={CORES.verde} fundo="var(--crm-etiqueta-cad-bg)" />}
              {!semContato && <span style={{ fontSize: 12, fontWeight: 600, color: corSit }}>{s.texto}</span>}
            </div>
          </button>
          {!semContato && temCadencia(lead) && (
            <button onClick={aoContatar} title="Registrar contato feito hoje"
              style={{ border: `1.5px solid ${CORES.verde}`, background: "none", color: CORES.verde, borderRadius: 8, padding: "8px 11px", fontSize: 12, fontWeight: 600, whiteSpace: "nowrap" }}>
              Contatei ✓
            </button>
          )}
        </div>
      );
    }

    /* ==== Detalhe ==== */
    function DetalheLead({ lead, aoEditar, aoContatar, aoMudarEtapa, aoDesfecho, aoPedirData, aoMudarCadencia, aoAlternarEx, aoExcluir, aoIntegrar, podeAgenda }) {
      const [confirmando, setConfirmando] = useState(false);
      const [motivo, setMotivo] = useState("");
      /* o seletor mostra os passos do dia a dia; a lista inteira de etapas é
         correção de cadastro, e fica atrás deste botão */
      const [corrigindo, setCorrigindo] = useState(false);
      const etapa = etapaPor(lead.etapa);
      const s2 = lead.sit2;
      const proximas = PROXIMAS_ETAPAS[lead.etapa] || [];
      const opcoes = corrigindo ? ETAPAS.map((e) => e.id) : [lead.etapa].concat(proximas);
      const tel = (lead.whatsapp || "").replace(/\D/g, "");
      const campo = { width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 14, background: CORES.branco, marginTop: 4 };
      const rot = { fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.suave };

      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 26, fontWeight: 600, margin: "0 0 4px" }}>{lead.nome}</h3>
          <div className="crm-responsavel">
            <span style={rot}>Responsável atual</span>
            <strong>{nomeDoResponsavel(lead.etapa)}</strong>
          </div>

          {lead.etapa === "agendado" && (
            <div className={"crm-bloco crm-bloco-" + s2.tipo}>
              <div style={rot}>Atendimento</div>
              {s2.tipo === "sem_data" ? (
                <div className="crm-bloco-valor crm-bloco-alerta"><IconeAlerta /> Data do atendimento não informada</div>
              ) : (
                <div className="crm-bloco-valor">
                  {formatarData(lead.dataAgendada)}
                  <span className="crm-bloco-quando"> · {distancia(lead.dataAgendada, hojeISO())}</span>
                </div>
              )}

              {(s2.tipo === "passou" || s2.tipo === "hoje") && (
                <>
                  <p className="crm-bloco-texto">
                    {s2.tipo === "passou"
                      ? "O atendimento já passou. O que aconteceu?"
                      : "O atendimento é hoje. Se já aconteceu, registre o resultado:"}
                  </p>
                  <div className="crm-c2-acoes crm-c2-acoes-par">
                    {DESFECHOS_DO_ATENDIMENTO.map((id) => (
                      <button key={id} className="crm-botao" onClick={() => aoDesfecho(id)}>{etapaPor(id).nome}</button>
                    ))}
                  </div>
                </>
              )}

              {/* depois do dia, a pergunta é só uma: remarcar não responde se ela veio */}
              {s2.tipo !== "passou" && (
                <button className={s2.tipo === "sem_data" ? "crm-botao crm-botao-cheio" : "crm-botao-texto"}
                  onClick={() => aoPedirData(s2.tipo === "sem_data" ? "informar" : "alterar")}>
                  {s2.tipo === "sem_data" ? "Informar data" : "Alterar data"}
                </button>
              )}
            </div>
          )}

          {lead.etapa === "fazer_orcamento" && (
            <div className="crm-bloco crm-bloco-orcamento">
              <div style={rot}>Prioridade</div>
              <div className="crm-bloco-valor">Fazer orçamento</div>
              <p className="crm-bloco-texto">
                {s2.texto}. Quando o orçamento estiver pronto, a lead volta para o Comercial 1, em Em aberto.
              </p>
              <button className="crm-botao crm-botao-cheio" onClick={() => aoDesfecho("em_aberto")}>Orçamento feito</button>
            </div>
          )}

          {(corrigindo || proximas.length > 0) && (
            <label style={{ display: "block", marginBottom: 6 }}>
              <span style={rot}>{corrigindo ? "Corrigir etapa" : "Etapa do funil"}</span>
              <select value={lead.etapa} style={campo}
                onChange={(e) => { setCorrigindo(false); aoMudarEtapa(e.target.value); }}>
                {opcoes.map((id) => {
                  const e = etapaPor(id);
                  return <option key={id} value={id}>{e.nome}{e.arquivo ? " (arquiva)" : ""}</option>;
                })}
              </select>
            </label>
          )}
          {corrigindo && (
            <p style={{ fontSize: 12, color: CORES.suaveForte, margin: "0 0 4px", lineHeight: 1.5 }}>
              Correção manual, para consertar um cadastro. No dia a dia, use as ações da ficha — elas passam a lead
              de um comercial para o outro do jeito certo. Agendado sempre pede a data do atendimento.
            </p>
          )}
          <div style={{ textAlign: "right", marginBottom: 12 }}>
            <button className="crm-botao-texto crm-botao-discreto" onClick={() => setCorrigindo(!corrigindo)}>
              {corrigindo ? "Voltar às ações do dia a dia" : "Corrigir etapa manualmente"}
            </button>
          </div>

          {etapa.cadencias.length > 0 && (
            <label style={{ display: "block", marginBottom: 12 }}>
              <span style={rot}>Cadência</span>
              <select value={lead.cadencia || etapa.cadencias[0]} onChange={(e) => aoMudarCadencia(e.target.value)} style={campo}>
                {etapa.cadencias.map((c) => <option key={c} value={c}>{cadenciaPor(c).nome}</option>)}
              </select>
            </label>
          )}

          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, marginBottom: 14, cursor: "pointer" }}>
            <input type="checkbox" checked={!!lead.exCliente} onChange={aoAlternarEx} style={{ width: 17, height: 17 }} />
            Ex-cliente (a venda dela conta como recompra)
          </label>

          <dl style={{ margin: "0 0 18px", fontSize: 14, lineHeight: 1.7 }}>
            <Linha rotulo="WhatsApp" valor={lead.whatsapp || "—"} />
            <Linha rotulo="Interesse" valor={lead.interesse || "—"} />
            <Linha rotulo="Origem" valor={origemPor(lead.origem)?.nome || "—"} />
            <Linha rotulo="Último contato" valor={formatarData(lead.ultimoContato)} />
            {/* no Comercial 2 a situação é a do atendimento, dita no bloco acima */}
            {!s2 && <Linha rotulo="Situação" valor={lead.sit?.texto || "—"} />}
            <Linha rotulo="Captada em" valor={formatarData(lead.criadoEm)} />
            {lead.dtConversa && <Linha rotulo="1ª conversa" valor={formatarData(lead.dtConversa)} />}
            {/* o dia em que foi agendada — marco do funil, não o dia em que vem */}
            {lead.dtAgendamento && <Linha rotulo="Agendou em" valor={formatarData(lead.dtAgendamento)} />}
            {/* fora de Agendado, a data do atendimento fica como histórico */}
            {lead.etapa !== "agendado" && dataValida(lead.dataAgendada) && (
              <Linha rotulo="Atendimento" valor={formatarData(lead.dataAgendada)} />
            )}
            {lead.dtComparecimento && <Linha rotulo="Comparecimento" valor={formatarData(lead.dtComparecimento)} />}
            {lead.dtVenda && <Linha rotulo="Venda" valor={formatarData(lead.dtVenda)} />}
            {lead.dtReprovado && <Linha rotulo="Encerrado em" valor={formatarData(lead.dtReprovado)} />}
            {lead.observacoes && (
              <div style={{ marginTop: 10 }}>
                <div style={rot}>Observações</div>
                <div style={{ whiteSpace: "pre-wrap", marginTop: 4 }}>{lead.observacoes}</div>
              </div>
            )}
          </dl>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            {tel && (
              <a href={`https://wa.me/55${tel}`} target="_blank" rel="noreferrer"
                style={{ background: CORES.verdeFundo, color: CORES.sobreVerde, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600, textDecoration: "none" }}>
                Abrir WhatsApp
              </a>
            )}
            {temCadencia(lead) && (
              <button onClick={aoContatar} style={{ border: `1.5px solid ${CORES.verde}`, background: "none", color: CORES.verde, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600 }}>
                Contatei hoje ✓
              </button>
            )}
            <button onClick={aoEditar} style={{ border: "1.5px solid var(--crm-borda-media)", background: "none", color: CORES.texto, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600 }}>
              Editar
            </button>
            {!confirmando && (
              <button onClick={() => setConfirmando(true)} style={{ border: "none", background: "none", color: CORES.atrasado, fontSize: 13, fontWeight: 600, marginLeft: "auto" }}>
                Mover para a lixeira
              </button>
            )}
          </div>

      {podeAgenda && (
            <button onClick={aoIntegrar}
              style={{ marginTop: 4, width: "100%", border: "1.5px solid var(--crm-borda-media)", background: "none", color: CORES.verde, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
              Vincular à Agenda
            </button>
          )}

      <HistoricoDaLead leadId={lead.id} />

      {confirmando && (
            <div style={{ marginTop: 16, padding: "14px 16px", borderRadius: 10, background: "var(--crm-superficie-2)" }}>
              <div style={{ fontWeight: 600, fontSize: 14 }}>Mover {lead.nome} para a lixeira?</div>
              <p style={{ fontSize: 13, color: CORES.suaveForte, margin: "6px 0 0", lineHeight: 1.5 }}>
                O lead sai das listas, do funil e das contagens, e pode ser restaurado pelo
                painel de manutenção durante 30 dias.
              </p>
              <label style={{ display: "block", marginTop: 12, fontSize: 11, fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.suaveForte }}>
                Motivo (opcional)
                <input value={motivo} onChange={(e) => setMotivo(e.target.value)} maxLength={120}
                  placeholder="Cadastro duplicado, criado por engano…"
                  style={{ display: "block", width: "100%", marginTop: 5, padding: "9px 12px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 14, background: CORES.branco, color: CORES.texto, letterSpacing: 0, textTransform: "none" }} />
              </label>
              <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                <button onClick={() => aoExcluir(motivo)}
                  style={{ border: "none", background: CORES.atrasado, color: "var(--crm-sobre-verde)", borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600 }}>
                  Mover para lixeira
                </button>
                <button onClick={() => setConfirmando(false)}
                  style={{ border: "1.5px solid var(--crm-borda-media)", background: "none", color: CORES.texto, borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600 }}>
                  Cancelar
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* A timeline é a mesma dos três módulos, montada fora do React porque
       quem desenha é o auditoria.js. O efeito só corre quando o id muda. */
    function HistoricoDaLead({ leadId }) {
      const caixa = React.useRef(null);

      useEffect(() => {
        if (!caixa.current || !window.FloreSerAuditoria) return;
        FloreSerAuditoria.montar(caixa.current, {
          modulo: "crm", entidade: "lead", entidadeId: leadId,
          api: (corpo) => chamarAPI(Object.assign({ token: SESSAO.token }, corpo)),
        });
      }, [leadId]);

      return (
        <div style={{ marginTop: 22 }}>
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.16em", textTransform: "uppercase", color: CORES.suave, paddingBottom: 8, marginBottom: 12, borderBottom: "1px solid var(--crm-borda-media)" }}>
            Histórico
          </div>
          <div ref={caixa}></div>
        </div>
      );
    }

    function Linha({ rotulo, valor }) {
      return (
        <div style={{ display: "flex", gap: 12 }}>
          <dt style={{ width: 122, fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.suave, paddingTop: 3 }}>{rotulo}</dt>
          <dd style={{ margin: 0, flex: 1 }}>{valor}</dd>
        </div>
      );
    }

    /* ==== Formulário ==== */
    function FormularioLead({ lead, aoSalvar, aoCancelar }) {
      const [d, setD] = useState({
        id: lead?.id,
        nome: lead?.nome || "",
        whatsapp: lead?.whatsapp || "",
        interesse: lead?.interesse || "",
        origem: lead?.origem || "",
        observacoes: lead?.observacoes || "",
        etapa: lead?.etapa || "nao_responde",
        cadencia: lead?.cadencia || "quente",
        exCliente: !!lead?.exCliente,
        ultimoContato: lead?.ultimoContato || hojeISO(),
        criadoEm: lead?.criadoEm || hojeISO(),
        dtConversa: lead?.dtConversa || "",
        dtAgendamento: lead?.dtAgendamento || "",
        dtComparecimento: lead?.dtComparecimento || "",
        dtVenda: lead?.dtVenda || "",
        dtReprovado: lead?.dtReprovado || "",
        dataAgendada: lead?.dataAgendada || "",
      });

      const etapa = etapaPor(d.etapa);
      const dataInvalida = !!d.ultimoContato && !!d.criadoEm && d.ultimoContato < d.criadoEm;
      /* Entrar em Agendado exige a data do atendimento. Uma lead que já
         estava em Agendado sem data (cadastro antigo) continua podendo ser
         editada — o Comercial 2 já mostra o alerta pedindo a data. */
      const entraEmAgendado = d.etapa === "agendado" && (!lead || lead.etapa !== "agendado");
      const faltaAtendimento = entraEmAgendado && !dataValida(d.dataAgendada);
      const podeSalvar = d.nome.trim().length > 0 && !dataInvalida && !faltaAtendimento;
      const campo = { display: "block", width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 14, background: CORES.branco, marginTop: 4 };
      const rot = { fontSize: 12, fontWeight: 600, color: CORES.texto, display: "block", marginTop: 13 };

      /* a captação sempre vem antes do contato: ao mudar uma data, ajusta a outra */
      function mudarCaptacao(valor) {
        setD((atual) => ({
          ...atual,
          criadoEm: valor,
          ultimoContato: atual.ultimoContato && valor && atual.ultimoContato < valor ? valor : atual.ultimoContato,
        }));
      }

      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: 0 }}>
            {lead ? "Editar lead" : "Novo lead"}
          </h3>

          <label style={rot}>Nome *
            <input style={campo} value={d.nome} onChange={(e) => setD({ ...d, nome: e.target.value })} placeholder="Nome da cliente" />
          </label>
          <label style={rot}>WhatsApp
            <input style={campo} value={d.whatsapp} onChange={(e) => setD({ ...d, whatsapp: e.target.value })} placeholder="(65) 99999-9999" />
          </label>
          <label style={rot}>Interesse
            <input style={campo} value={d.interesse} onChange={(e) => setD({ ...d, interesse: e.target.value })} placeholder="Ex.: Ultraformer, limpeza de pele…" />
          </label>
          <label style={rot}>Origem
            <select style={campo} value={d.origem} onChange={(e) => setD({ ...d, origem: e.target.value })}>
              <option value="">— não informado —</option>
              {ORIGENS.map((o) => <option key={o.id} value={o.id}>{o.nome}</option>)}
            </select>
          </label>
          <label style={rot}>Etapa do funil
            <select style={campo} value={d.etapa}
              onChange={(e) => setD({ ...d, etapa: e.target.value, cadencia: cadenciaValida(e.target.value, d.cadencia) })}>
              {ETAPAS.map((e) => <option key={e.id} value={e.id}>{e.nome}</option>)}
            </select>
          </label>
          {etapa.cadencias.length > 0 ? (
            <label style={rot}>Cadência
              <select style={campo} value={d.cadencia} onChange={(e) => setD({ ...d, cadencia: e.target.value })}>
                {etapa.cadencias.map((c) => <option key={c} value={c}>{cadenciaPor(c).nome}</option>)}
              </select>
            </label>
          ) : (
            <div style={{ fontSize: 12.5, color: CORES.verde, marginTop: 13 }}>Esta etapa não tem cadência de follow-up.</div>
          )}
          {d.etapa === "agendado" && (
            <>
              <label style={rot}>Data do atendimento{entraEmAgendado ? " *" : ""}
                <input type="date" style={{ ...campo, borderColor: faltaAtendimento ? CORES.ouro : "var(--crm-borda-forte)" }}
                  value={d.dataAgendada} onChange={(e) => setD({ ...d, dataAgendada: e.target.value })} />
              </label>
              <div style={{ fontSize: 12, color: CORES.suaveForte, marginTop: 5, lineHeight: 1.45 }}>
                O dia marcado para vir à clínica. É por ele que o Comercial 2 sabe quando registrar o resultado.
              </div>
            </>
          )}
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, marginTop: 14, cursor: "pointer" }}>
            <input type="checkbox" checked={d.exCliente} onChange={(e) => setD({ ...d, exCliente: e.target.checked })} style={{ width: 17, height: 17 }} />
            Ex-cliente
          </label>
          <label style={rot}>Data de captação
            <input type="date" style={campo} value={d.criadoEm} onChange={(e) => mudarCaptacao(e.target.value)} />
          </label>
          <label style={rot}>Data do último contato
            <input type="date" style={{ ...campo, borderColor: dataInvalida ? CORES.atrasado : "var(--crm-borda-forte)" }}
              value={d.ultimoContato} min={d.criadoEm || undefined}
              onChange={(e) => setD({ ...d, ultimoContato: e.target.value })} />
          </label>
          {dataInvalida && (
            <div style={{ color: CORES.atrasado, fontSize: 12.5, marginTop: 6 }}>
              O último contato não pode ser anterior à captação ({formatarData(d.criadoEm)}).
            </div>
          )}
          <label style={rot}>Observações
            <textarea style={{ ...campo, minHeight: 76, resize: "vertical" }} value={d.observacoes}
              onChange={(e) => setD({ ...d, observacoes: e.target.value })}
              placeholder="Como conheceu a clínica, preferências, histórico da conversa…" />
          </label>

          <div style={{ display: "flex", gap: 8, marginTop: 20 }}>
            <button disabled={!podeSalvar} onClick={() => aoSalvar(d)}
              style={{ background: podeSalvar ? CORES.verdeFundo : "var(--crm-desativado)", color: CORES.sobreVerde, border: "none", borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600, cursor: podeSalvar ? "pointer" : "not-allowed" }}>
              Salvar lead
            </button>
            <button onClick={aoCancelar} style={{ background: "none", border: "1.5px solid var(--crm-borda-media)", color: CORES.texto, borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600 }}>
              Cancelar
            </button>
          </div>
        </div>
      );
    }

    /* ==== Importação ==== */
    function normalizarData(valor) {
      if (!valor && valor !== 0) return "";
      if (valor instanceof Date && !isNaN(valor)) {
        return `${valor.getFullYear()}-${String(valor.getMonth() + 1).padStart(2, "0")}-${String(valor.getDate()).padStart(2, "0")}`;
      }
      const s = String(valor).trim();
      let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (m) {
        const ano = m[3].length === 2 ? `20${m[3]}` : m[3];
        return `${ano}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
      }
      return "";
    }

    function acharEtapa(texto) {
      const t = String(texto || "").trim().toLowerCase();
      if (!t) return null;
      const achada = ETAPAS.find((e) => e.nome.toLowerCase() === t || e.id === t);
      if (achada) return achada.id;
      if (t.includes("não resp") || t.includes("nao resp")) return "nao_responde";
      if (t.includes("nurtur") || t.includes("nutri")) return "nurturing";
      if (t.includes("convers")) return "conversando";
      /* "Agendando" era uma etapa que saiu: quem vier assim da planilha entra
         como Conversando, igual ao que acontece com os cadastros antigos */
      if (t.includes("agendand")) return "conversando";
      if (t.includes("agendad")) return "agendado";
      /* "Fazer orçamento" é o orçamento que ainda falta preparar. Qualquer
         outro "orçamento" — a antiga "Com orçamento" — é o que já existe, e
         continua sendo Em aberto, como sempre foi. */
      if ((t.includes("fazer") || t.includes("preparar")) && (t.includes("orçam") || t.includes("orcam"))) return "fazer_orcamento";
      if (t.includes("aberto") || t.includes("orçam") || t.includes("orcam")) return "em_aberto";
      if (t.includes("falt")) return "falta";
      if (t.includes("reprov")) return "venda_reprovada";
      if (t.includes("recus") || t.includes("perdid") || t.includes("descart")) return "recusado";
      if (t.includes("vend")) return "venda";
      return null;
    }

    function acharOrigem(texto) {
      const t = String(texto || "").trim().toLowerCase();
      if (!t) return "";
      const achada = ORIGENS.find((o) => o.nome.toLowerCase() === t || o.id === t);
      if (achada) return achada.id;
      if (t.includes("insta")) return "instagram";
      if (t.includes("rádio") || t.includes("radio")) return "radio";
      if (t.includes("vale") || t.includes("presente")) return "vale_presente";
      if (t.includes("indica")) return "indicacao";
      if (t.includes("google") || t.includes("busca")) return "google";
      return "outros";
    }

    function ImportarPlanilha({ aoImportar, aoCancelar }) {
      const [linhas, setLinhas] = useState(null);
      const [colunas, setColunas] = useState([]);
      const [mapa, setMapa] = useState({ nome: "", whatsapp: "", interesse: "", origem: "", observacoes: "", etapa: "", exCliente: "", ultimoContato: "", dataAgendada: "" });
      const [etapaPadrao, setEtapaPadrao] = useState("nao_responde");
      const [erroArq, setErroArq] = useState(null);

      async function lerArquivo(e) {
        const arquivo = e.target.files?.[0];
        if (!arquivo) return;
        setErroArq(null);
        try {
          const buf = await arquivo.arrayBuffer();
          const wb = XLSX.read(buf, { cellDates: true });
          const dados = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
          if (!dados.length) { setErroArq("A planilha está vazia ou sem cabeçalhos na primeira linha."); return; }
          const cab = Object.keys(dados[0]);
          const achar = (...t) => cab.find((h) => t.some((x) => h.toLowerCase().includes(x))) || "";
          /* A data do atendimento primeiro, e o último contato sem ela: uma
             coluna "Data do atendimento" também tem "data" no nome, e virar
             último contato faria a lead parecer contatada no dia em que vem. */
          const atendimento = achar("atendimento", "data agendada", "agendada para", "data da consulta");
          const contato = achar("contato") ||
            cab.find((h) => h !== atendimento && h.toLowerCase().includes("data")) || "";
          setColunas(cab);
          setLinhas(dados);
          setMapa({
            nome: achar("nome", "cliente", "lead"),
            whatsapp: achar("whats", "telefone", "celular", "fone"),
            interesse: achar("interesse", "tratamento", "procedimento"),
            origem: achar("origem", "fonte", "veio"),
            observacoes: achar("obs", "nota", "coment"),
            etapa: achar("etapa", "situa", "status", "categoria"),
            exCliente: achar("ex-cliente", "ex cliente", "recompra"),
            ultimoContato: contato,
            dataAgendada: atendimento,
          });
        } catch {
          setErroArq("Não consegui ler este arquivo. Use .xlsx, .xls ou .csv.");
        }
      }

      const validos = useMemo(() => {
        if (!linhas || !mapa.nome) return [];
        return linhas.map((r) => {
          const nome = String(r[mapa.nome] ?? "").trim();
          if (!nome) return null;
          const etapaId = (mapa.etapa && acharEtapa(r[mapa.etapa])) || etapaPadrao;
          const ex = mapa.exCliente
            ? ["sim", "s", "x", "true", "1", "ex-cliente", "ex cliente"].includes(String(r[mapa.exCliente] ?? "").trim().toLowerCase())
            : false;
          const contato = (mapa.ultimoContato && normalizarData(r[mapa.ultimoContato])) || hojeISO();
          /* se o contato da planilha é mais antigo que hoje, ele também marca a captação */
          const captacao = contato < hojeISO() ? contato : hojeISO();
          /* Só a coluna que diz a data do atendimento vira dataAgendada. Uma
             coluna de "agendamento" como marco do funil não é o dia em que a
             pessoa vem, e não é tratada como se fosse. */
          const atendimento = (mapa.dataAgendada && normalizarData(r[mapa.dataAgendada])) || "";
          return {
            nome,
            whatsapp: mapa.whatsapp ? String(r[mapa.whatsapp] ?? "").trim() : "",
            interesse: mapa.interesse ? String(r[mapa.interesse] ?? "").trim() : "",
            origem: mapa.origem ? acharOrigem(r[mapa.origem]) : "",
            observacoes: mapa.observacoes ? String(r[mapa.observacoes] ?? "").trim() : "",
            etapa: etapaId,
            cadencia: cadenciaValida(etapaId, "quente"),
            exCliente: ex,
            ultimoContato: contato,
            criadoEm: captacao,
            dataAgendada: dataValida(atendimento) ? atendimento : "",
          };
        }).filter(Boolean);
      }, [linhas, mapa, etapaPadrao]);

      const campo = { display: "block", width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 13, background: CORES.branco, marginTop: 4 };
      const rot = { fontSize: 12, fontWeight: 600, color: CORES.texto, display: "block", marginTop: 12 };

      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: 0 }}>Importar planilha</h3>
          <p style={{ fontSize: 13, color: CORES.verde, margin: "6px 0 14px" }}>
            A primeira linha deve ter os títulos das colunas (Nome, WhatsApp, Etapa…).
          </p>
          <input type="file" accept=".xlsx,.xls,.csv" onChange={lerArquivo} style={{ fontSize: 13 }} />
          {erroArq && <div style={{ color: CORES.atrasado, fontSize: 13, marginTop: 8 }}>{erroArq}</div>}

          {linhas && (
            <>
              <div style={{ background: "var(--crm-superficie-2)", borderRadius: 10, padding: "12px 14px", marginTop: 16 }}>
                <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.ouro }}>
                  Combine as colunas da sua planilha
                </div>
                {[["nome", "Nome *"], ["whatsapp", "WhatsApp"], ["interesse", "Interesse"], ["observacoes", "Observações"], ["etapa", "Etapa"], ["exCliente", "Ex-cliente"], ["ultimoContato", "Último contato"], ["dataAgendada", "Data do atendimento"]].map(([k, txt]) => (
                  <label key={k} style={rot}>{txt}
                    <select style={campo} value={mapa[k]} onChange={(e) => setMapa({ ...mapa, [k]: e.target.value })}>
                      <option value="">— não importar —</option>
                      {colunas.map((c) => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </label>
                ))}
                <label style={rot}>Etapa padrão (quando a linha não tiver etapa reconhecida)
                  <select style={campo} value={etapaPadrao} onChange={(e) => setEtapaPadrao(e.target.value)}>
                    {ETAPAS.map((e) => <option key={e.id} value={e.id}>{e.nome}</option>)}
                  </select>
                </label>
              </div>

              <div style={{ fontSize: 13, marginTop: 14 }}>
                {mapa.nome
                  ? <>Prontos para importar: <strong>{validos.length}</strong> lead{validos.length !== 1 ? "s" : ""}. Linhas sem nome são ignoradas.</>
                  : "Escolha qual coluna contém o nome do lead."}
              </div>

              <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                <button disabled={!validos.length} onClick={() => aoImportar(validos)}
                  style={{ background: validos.length ? CORES.verdeFundo : "var(--crm-desativado)", color: CORES.sobreVerde, border: "none", borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600, cursor: validos.length ? "pointer" : "not-allowed" }}>
                  Importar {validos.length || ""} lead{validos.length !== 1 ? "s" : ""}
                </button>
                <button onClick={aoCancelar} style={{ background: "none", border: "1.5px solid var(--crm-borda-media)", color: CORES.texto, borderRadius: 8, padding: "11px 20px", fontSize: 14, fontWeight: 600 }}>
                  Cancelar
                </button>
              </div>
            </>
          )}
        </div>
      );
    }

    /* ================================================================
       A data do atendimento
       ----------------------------------------------------------------
       Pedida ao entrar em Agendado, ao completar uma lead antiga que não
       tem data e ao remarcar. Sem data não há Agendado: é ela que diz ao
       Comercial 2 quando perguntar se a pessoa veio.

       Com acesso à Agenda, a mesma data vai para lá — "Só no CRM" é sempre
       uma saída, e a data continua salva no CRM do mesmo jeito.
       ================================================================ */
    const AREAS_AGENDA = [["facial", "Facial"], ["corporal", "Corporal"], ["capilar", "Capilar"]];
    /* 14, e não 15: duas semanas certas mantêm o dia da semana */
    const CICLOS_AGENDA = [7, 14, 21, 30, 45, 60, 90];

    function DialogoAtendimento({ lead, modo, hoje, podeAgenda, aoConfirmar, aoFechar }) {
      /* remarcar parte da data de agora; entrar em Agendado — inclusive
         vindo de Falta — pede uma data NOVA, nunca a antiga de novo */
      const [data, setData] = useState(modo === "alterar" && dataValida(lead.dataAgendada) ? lead.dataAgendada : "");
      const [area, setArea] = useState("facial");
      const [freq, setFreq] = useState(21);
      const valida = dataValida(data);

      const titulo = modo === "entrar" ? "Marcar o atendimento"
        : modo === "alterar" ? "Alterar a data do atendimento"
          : "Informar a data do atendimento";
      const texto = modo === "entrar"
        ? `Ao salvar, ${lead.nome} vai para Agendado e passa para o Comercial 2.`
        : modo === "alterar"
          ? `Hoje o atendimento de ${lead.nome} está marcado para ${formatarData(lead.dataAgendada)}.`
          : `${lead.nome} está em Agendado, mas sem o dia do atendimento. Sem ele, o Comercial 2 não sabe quando registrar o resultado.`;

      return (
        <div className="crm-dialogo">
          <h3>{titulo}</h3>
          <p className="crm-dialogo-texto">{texto}</p>

          <label className="crm-dialogo-campo">
            <span>Data do atendimento</span>
            <input type="date" value={data} required autoFocus onChange={(e) => setData(e.target.value)} />
          </label>
          {valida && data < hoje && (
            <p className="crm-dialogo-nota">
              Essa data já passou: a lead aparece no Comercial 2 pedindo o resultado — Falta ou Fazer orçamento.
            </p>
          )}

          {podeAgenda && (
            <fieldset className="crm-dialogo-agenda">
              <legend>Na Agenda</legend>
              <p>A mesma data vai para a ficha da paciente. Se ela ainda não existir, é criada agora.</p>
              <div className="crm-dialogo-par">
                <label className="crm-dialogo-campo">
                  <span>Área</span>
                  {/* nada de adivinhar a área pelo texto do interesse: quem sabe é quem atende */}
                  <select value={area} onChange={(e) => setArea(e.target.value)}>
                    {AREAS_AGENDA.map(([id, nome]) => <option key={id} value={id}>{nome}</option>)}
                  </select>
                </label>
                <label className="crm-dialogo-campo">
                  <span>Ciclo de retorno</span>
                  <select value={freq} onChange={(e) => setFreq(Number(e.target.value))}>
                    {CICLOS_AGENDA.map((d) => <option key={d} value={d}>{d} dias</option>)}
                  </select>
                </label>
              </div>
            </fieldset>
          )}

          <div className="crm-dialogo-botoes">
            {podeAgenda ? (
              <>
                <button className="crm-botao crm-botao-cheio" disabled={!valida}
                  onClick={() => aoConfirmar(data, { area: area, freq: freq })}>
                  Salvar e marcar na Agenda
                </button>
                <button className="crm-botao" disabled={!valida} onClick={() => aoConfirmar(data, null)}>
                  Só no CRM
                </button>
              </>
            ) : (
              <>
                <button className="crm-botao crm-botao-cheio" disabled={!valida} onClick={() => aoConfirmar(data, null)}>
                  Salvar
                </button>
                <button className="crm-botao" onClick={aoFechar}>Cancelar</button>
              </>
            )}
          </div>
        </div>
      );
    }

    /* ================================================================
       A conversa da integração com a Agenda
       ----------------------------------------------------------------
       O botão "Vincular à Agenda" da ficha abre o formulário; depois dele
       podem vir a lista de pacientes parecidas e o aviso de que já existe
       vínculo. Nada disto é obrigatório — Cancelar é sempre uma saída.
       ================================================================ */
    function TelaIntegracao({ estado, aoFechar, aoEnviar }) {
      const lead = estado.lead || {};
      const [area, setArea] = useState("facial");
      /* a data do atendimento que o CRM já tem é a que vai para a Agenda:
         as duas não nascem diferentes */
      const [data, setData] = useState(lead.etapa === "agendado" && dataValida(lead.dataAgendada) ? lead.dataAgendada : "");
      const [freq, setFreq] = useState(21);

      const rot = { fontSize: 11, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase", color: CORES.suave };
      const campo = { width: "100%", padding: "9px 12px", borderRadius: 8, border: "1px solid var(--crm-borda-forte)", fontSize: 14, background: CORES.branco, color: CORES.texto, marginTop: 4 };
      const botao = { border: "none", borderRadius: 8, padding: "11px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer" };
      const secundario = { ...botao, border: "1.5px solid var(--crm-borda-media)", background: "none", color: CORES.texto };
      const principal = { ...botao, background: CORES.verdeFundo, color: "var(--crm-sobre-verde)" };

      if (estado.etapa === "enviando") {
        return <p style={{ fontSize: 14, color: CORES.suaveForte }}>Integrando…</p>;
      }

      if (estado.etapa === "erro") {
        return (
          <div>
            <p style={{ fontSize: 14, color: CORES.atrasado, marginTop: 0 }}>{estado.mensagem}</p>
            <button onClick={aoFechar} style={secundario}>Fechar</button>
          </div>
        );
      }

      if (estado.etapa === "jaVinculada") {
        return (
          <div>
            <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: "0 0 8px" }}>
              Já existe vínculo
            </h3>
            <p style={{ fontSize: 14, color: CORES.suaveForte, lineHeight: 1.5 }}>
              Esta lead já está vinculada a <b>{estado.pacienteNome}</b> na Agenda.
            </p>
            <div style={{ display: "flex", gap: 8, marginTop: 16, flexWrap: "wrap" }}>
              <a href={"../agenda/?paciente=" + encodeURIComponent(estado.pacienteId)}
                style={{ ...principal, textDecoration: "none", display: "inline-block" }}>
                Abrir na Agenda
              </a>
              <button onClick={aoFechar} style={secundario}>Fechar</button>
            </div>
          </div>
        );
      }

      if (estado.etapa === "parecidas") {
        return (
          <div>
            <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: "0 0 8px" }}>
              Possível paciente já cadastrada
            </h3>
            <p style={{ fontSize: 13.5, color: CORES.suaveForte, lineHeight: 1.5 }}>
              Antes de criar outra ficha, veja se não é a mesma pessoa.
            </p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, margin: "14px 0" }}>
              {(estado.parecidas || []).map((p) => (
                <div key={p.id} style={{ border: "1px solid var(--crm-borda-media)", borderRadius: 10, padding: "12px 14px" }}>
                  <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 19 }}>
                    {p.nome}{p.arquivada ? " · arquivada" : ""}
                  </div>
                  <div style={{ fontSize: 11.5, color: CORES.suave, marginTop: 2 }}>
                    {p.motivo}{p.whatsapp ? " · " + p.whatsapp : ""}
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                    <a href={"../agenda/?paciente=" + encodeURIComponent(p.id)}
                      style={{ ...secundario, textDecoration: "none", display: "inline-block", fontSize: 12 }}>
                      Ver ficha
                    </a>
                    <button style={{ ...principal, fontSize: 12 }}
                      onClick={() => aoEnviar({ ...estado.pedido, confirmarPacienteId: p.id })}>
                      Vincular a esta paciente
                    </button>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button style={secundario}
                onClick={() => aoEnviar({ ...estado.pedido, criarMesmoAssim: true })}>
                Criar outra
              </button>
              <button onClick={aoFechar} style={secundario}>Cancelar</button>
            </div>
          </div>
        );
      }

      /* As etapas que o servidor leva a Agendado quando a Agenda recebe uma
         data — as de antes do agendamento (NIVEL_ETAPA < 2 no Apps Script).
         Sem data, ele só faz o vínculo: Agendado sem dia não existe. */
      const antesDoAgendamento = ["nao_responde", "conversando", "nurturing", "falta", "recusado"].includes(lead.etapa);
      const efeito = lead.etapa === "agendado"
        ? "A Agenda recebe a mesma data do atendimento que está no CRM."
        : antesDoAgendamento
          ? "Com data, a lead também passa para Agendado no CRM, com esse mesmo dia. Sem data, só o vínculo é feito."
          : "A etapa no CRM não muda. A data, se informada, vai só para a Agenda.";

      /* o formulário */
      return (
        <div>
          <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, margin: "0 0 8px" }}>
            Vincular à Agenda
          </h3>
          <p style={{ fontSize: 13.5, color: CORES.suaveForte, lineHeight: 1.5, margin: "0 0 14px" }}>
            Cria a ficha de {lead.nome} na Agenda, ou liga a uma que já existe. {efeito}
          </p>

          <dl style={{ margin: "0 0 16px", fontSize: 14, lineHeight: 1.7 }}>
            <Linha rotulo="Nome" valor={lead.nome || "—"} />
            <Linha rotulo="WhatsApp" valor={lead.whatsapp || "—"} />
            <Linha rotulo="Origem" valor={origemPor(lead.origem)?.nome || "—"} />
          </dl>

          <label style={{ display: "block", marginBottom: 12 }}>
            <span style={rot}>Área</span>
            {/* nada de adivinhar a área pelo texto do interesse: quem sabe é quem atende */}
            <select value={area} onChange={(e) => setArea(e.target.value)} style={campo}>
              <option value="facial">Facial</option>
              <option value="corporal">Corporal</option>
              <option value="capilar">Capilar</option>
            </select>
          </label>

          <label style={{ display: "block", marginBottom: 12 }}>
            <span style={rot}>Data do atendimento</span>
            <input type="date" value={data} onChange={(e) => setData(e.target.value)} style={campo} />
          </label>

          <label style={{ display: "block", marginBottom: 16 }}>
            <span style={rot}>Ciclo de retorno</span>
            <select value={freq} onChange={(e) => setFreq(Number(e.target.value))} style={campo}>
              {CICLOS_AGENDA.map((d) => (
                <option key={d} value={d}>{d} dias</option>
              ))}
            </select>
          </label>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button style={principal}
              onClick={() => aoEnviar({ leadId: lead.id, area: area, data: dataValida(data) ? data : "", freq: freq })}>
              {dataValida(data) ? "Vincular e agendar" : "Só vincular"}
            </button>
            <button onClick={aoFechar} style={secundario}>Cancelar</button>
          </div>
        </div>
      );
    }

    /* ==== Modal ==== */
    function Modal({ children, aoFechar }) {
      return (
        <div onClick={aoFechar}
          style={{ position: "fixed", inset: 0, background: "rgba(30,58,58,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50, padding: 12 }}>
          <div onClick={(e) => e.stopPropagation()}
            style={{ background: CORES.areia, borderRadius: 16, padding: "22px 20px 26px", width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto", boxShadow: "0 12px 40px rgba(30,58,58,0.3)" }}>
            <button onClick={aoFechar} aria-label="Fechar" style={{ float: "right", border: "none", background: "none", fontSize: 18, color: CORES.verde, marginTop: -6 }}>✕</button>
            {children}
          </div>
        </div>
      );
    }

    /* ==== Tela de entrada com senha ==== */
    function Portao() {
      const [senha, setSenha] = useState("");
      /* Começa em "retomando" quando existe sessão de usuário guardada: o
         portão não chega a ser desenhado, e o formulário de senha não pisca
         antes da tela de espera. Sem sessão, começa no portão de sempre. */
      const [estado, setEstado] = useState(
        () => (window.FloreSerAuth && window.FloreSerAuth.token()) ? "retomando" : "form"
      ); // form | retomando | verificando | ok
      const [erro, setErro] = useState("");
      const [mostrar, setMostrar] = useState(false);

      /* Entrada por usuário individual: a tela é a mesma do portal, servida
         pelo auth.js. Aqui só dizemos qual módulo estamos pedindo e o que
         fazer quando a pessoa entrar — nada de segunda tela nem de segunda
         sessão. A permissão de verdade é conferida pelo Apps Script em toda
         chamada. */
      function abrirLoginDeUsuario() {
        setErro("");
        window.FloreSerAuth.abrirLogin({
          modulo: "crm",
          aoEntrar: function (r) {
            SESSAO.token = r.token;
            ORIGEM_SESSAO = { tipo: "usuario" };
            setEstado("ok");
          },
        });
      }

      /* Troca a senha por um token de sessão. A senha não fica guardada aqui
         nem é reenviada depois: daqui para a frente só o token viaja. */
      async function entrar() {
        if (!senha.trim()) return;
        setEstado("verificando");
        setErro("");
        try {
          const r = await chamarAPI({ acao: "entrar", modulo: "crm", senha: senha });
          if (!r.ok) {
            if (r.erro === "bloqueado") {
              setErro("Muitas tentativas erradas. Tente de novo em " + (r.minutos || 15) + " minutos.");
            } else if (r.erro === "senha") {
              setErro("Senha incorreta. Confira e tente de novo." +
                (r.restam ? " Restam " + r.restam + " tentativas." : ""));
            } else {
              setErro("Não foi possível conectar à planilha. Verifique a publicação do Apps Script.");
            }
            setEstado("form");
            return;
          }
          SESSAO.token = r.token;
          guardarToken(r.token);
          setEstado("ok");
        } catch (e) {
          setErro("Sem conexão com a planilha. Confira a URL do Apps Script e sua internet.");
          setEstado("form");
        }
      }

      /* Ao abrir: primeiro a sessão de usuário guardada neste navegador, que
         vale para os três módulos; depois a sessão da senha desta aba. */
      useEffect(() => {
        let vivo = true;
        (async () => {
          if (window.FloreSerAuth && window.FloreSerAuth.token()) {
            const entrou = await window.FloreSerAuth.tentarRetomar("crm", {
              /* a tela de espera saiu; o portão assume */
              aoPedirSenha() { if (vivo) setEstado("form"); },
              aoEntrar(r) {
                if (!vivo) return;
                SESSAO.token = r.token;
                ORIGEM_SESSAO = { tipo: "usuario" };
                setEstado("ok");
              },
            });
            if (!vivo) return;
            if (entrou) {
              SESSAO.token = window.FloreSerAuth.token();
              ORIGEM_SESSAO = { tipo: "usuario" };
              setEstado("ok");
              /* o CRM assume a tela e cuida do próprio carregamento, com o
                 aviso dele se algo falhar */
              window.FloreSerAuth.encerrarRetomada();
            }
            /* Deu errado: a tela do auth.js continua no ar com o motivo, e
               é ela quem oferece as saídas. Cair para a sessão da senha
               aqui esconderia o erro. */
            return;
          }

          const guardado = tokenGuardado();
          if (!guardado) return;
          SESSAO.token = guardado;
          try {
            const r = await chamarAPI({ acao: "ler", token: guardado });
            if (!vivo) return;
            if (r.ok) { setEstado("ok"); return; }
            esquecerToken();
            SESSAO.token = "";
            if (r.erro === "sessao") setErro("Sua sessão expirou. Informe a senha de novo.");
          } catch (e) {
            esquecerToken();
            SESSAO.token = "";
          }
        })();
        return () => { vivo = false; };
      }, []);

      if (estado === "ok") return <CRMFloreSer />;

      /* Enquanto a retomada corre, quem está na tela é o cartão do auth.js.
         Desenhar o portão por baixo faria o formulário de senha piscar. */
      if (estado === "retomando") return null;

      const carregando = estado === "verificando";

      return (
        <div className="pt-fundo">

          <div className="pt-cartao">
            <img className="pt-marca" src="../logo.png" width="366" height="380" alt="Símbolo FloreSer" />
            <h1 className="pt-nome">CRM Flore<span>Ser</span></h1>
            <p className="pt-tag">Clínica Corpo e Alma</p>
            <div className="pt-risco"></div>

            <div className="pt-campo">
              <label className="pt-so-leitor" htmlFor="pt-senha">Senha de acesso</label>
              <svg className="pt-cadeado" width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" aria-hidden="true">
                <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" />
                <path d="M8.2 10.5V7.8a3.8 3.8 0 0 1 7.6 0v2.7" />
              </svg>

              <input
                id="pt-senha"
                type={mostrar ? "text" : "password"}
                value={senha}
                onChange={(e) => setSenha(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") entrar(); }}
                placeholder="Senha de acesso"
                autoComplete="current-password"
                disabled={carregando}
                autoFocus
              />

              <button type="button" className="pt-olho"
                onClick={() => setMostrar(!mostrar)}
                aria-pressed={mostrar}
                aria-label={mostrar ? "Ocultar senha" : "Mostrar senha"}>
                {mostrar ? (
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d="M2.5 12S6.1 5.5 12 5.5c1.6 0 3 .3 4.3.9M21.5 12s-3.6 6.5-9.5 6.5c-1.7 0-3.1-.3-4.4-.9" />
                    <path d="M9.7 9.8a3 3 0 0 0 4.2 4.2" />
                    <path d="M4.2 19.8 19.8 4.2" />
                  </svg>
                ) : (
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d="M2.5 12S6.1 5.5 12 5.5 21.5 12 21.5 12 17.9 18.5 12 18.5 2.5 12 2.5 12Z" />
                    <circle cx="12" cy="12" r="2.8" />
                  </svg>
                )}
              </button>
            </div>

            {erro && (
              <div className="pt-erro" role="alert">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  strokeWidth="1.5" strokeLinecap="round" aria-hidden="true">
                  <path d="M12 3.8 21 19.5H3L12 3.8Z" />
                  <path d="M12 10v4M12 16.6v.4" />
                </svg>
                <span>{erro}</span>
              </div>
            )}

            <button
              className={carregando ? "pt-entrar carregando" : "pt-entrar"}
              onClick={entrar}
              disabled={carregando || !senha.trim()}
            >
              {carregando ? "Conectando…" : "Entrar"}
            </button>
            <button type="button" className="pt-alternar" onClick={abrirLoginDeUsuario}>
              Entrar com usuário
            </button>
          </div>

          <a className="pt-volta" href="../">‹ Início</a>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Portao />);
  </script>
</body>

</html>
